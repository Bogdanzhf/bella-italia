  - slug: riflessivi-passato
    title_it: "Mi sono divertita!"
    title_ru: "Возвратные глаголы в прошедшем"
    theory: |
      ## Passato prossimo возвратных глаголов

      Возвратные глаголы **всегда** образуют сложные времена с **essere**, поэтому причастие согласуется с подлежащим:

      | | **alzarsi** |
      |---|---|
      | io | **mi sono** alzato / alzat**a** |
      | tu | **ti sei** alzato / alzat**a** |
      | lui / lei | **si è** alzato / alzat**a** |
      | noi | **ci siamo** alzati / alzat**e** |
      | voi | **vi siete** alzati / alzat**e** |
      | loro | **si sono** alzati / alzat**e** |

      * *Ieri Alberto **si è alzato** tardi. Chiara **si è alzata** tardi.*
      * *Alberto e Chiara **si sono alzati** tardi. Chiara e Giovanna **si sono alzate** tardi.*

      ## С модальными глаголами

      Местоимение — **перед** модальным глаголом или **в конце** инфинитива:
      * ***Mi** devo svegliare presto.* = *Devo svegliar**mi** presto.*

      В прошедшем: если местоимение впереди — **essere**, если в конце — **avere**:
      * *Non **mi sono** potut**a** svegliare.* = *Non **ho** potuto svegliar**mi**.*
    words:
      - "farsi la barba | бриться"
      - "spogliarsi | раздеваться"
      - "l'operaio | рабочий | m"
      - "la montatura | оправа"
      - "gli occhiali da vista | очки (для зрения)"
      - "entrambi | оба"
      - "intanto | пока что, тем временем"
      - "dip`endere | зависеть"
    phrases:
      - "Mi sono divertita molto! | Я очень повеселилась!"
      - "A che ora ti sei svegliata? | Во сколько ты проснулась?"
      - "Ci siamo conosciuti a Roma. | Мы познакомились в Риме."
      - "Non mi sono potuta riposare. | Я не смогла отдохнуть."
    exercises:
      - type: choice
        level: 2
        q: "Ieri Anna ___ tardi. (svegliarsi)"
        options: ["si è svegliata", "si ha svegliato", "si è svegliato", "ha svegliata"]
        answer: 0
      - type: choice
        level: 2
        q: "I ragazzi ___ alla festa. (divertirsi)"
        options: ["si sono divertiti", "si hanno divertito", "sono divertiti", "si è divertito"]
        answer: 0
      - type: choice
        level: 2
        q: "«Я должна вставать рано» —"
        options: ["Devo mi alzare presto.", "Mi devo alzare presto.", "Devo alzare mi presto.", "Mi devo alzarmi presto."]
        answer: 1
      - type: choice
        level: 3
        q: "Non ___ potuto riposarmi."
        options: ["sono", "ho", "mi sono", "mi ho"]
        answer: 1
        explain: "Местоимение в конце инфинитива → avere."
      - type: input
        level: 3
        q: "Io (Sofia) ___ (vestirsi) in fretta. (passato prossimo)"
        answer: ["mi sono vestita"]
      - type: input
        level: 3
        q: "Noi ___ (conoscersi) all'università. (passato prossimo)"
        answer: ["ci siamo conosciuti", "ci siamo conosciute"]
