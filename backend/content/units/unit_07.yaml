        answer: 0
      - type: choice
        level: 1
        q: "Imperfetto от *essere* (io):"
        options: ["essevo", "ero", "stavo", "sono stato"]
        answer: 1
      - type: choice
        level: 2
        q: "Ogni domenica noi ___ dai nonni. (andare)"
        options: ["andavamo", "siamo andati", "andiamo", "andavano"]
        answer: 0
