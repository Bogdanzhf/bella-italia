    phrases:
      - "Ti ricordi? | Ты помнишь?"
      - "Mentre camminavo, ho incontrato Dino. | Пока я гуляла, я встретила Дино."
      - "Non c'era molta gente in giro. | Вокруг было немного людей."
      - "Chissà! | Кто знает!"
