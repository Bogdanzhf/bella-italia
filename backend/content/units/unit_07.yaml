  - slug: trapassato-prossimo
    title_it: "Avevamo deciso di andare al cinema…"
    title_ru: "Trapassato prossimo"
    theory: |
      ## Предпрошедшее время

      **avere / essere в imperfetto** + **причастие**:

      | | **fare** | **andare** |
      |---|---|---|
      | io | **avevo** fatto | **ero** andato/a |
      | tu | **avevi** fatto | **eri** andato/a |
      | lui / lei | **aveva** fatto | **era** andato/a |
      | noi | **avevamo** fatto | **eravamo** andati/e |
      | voi | **avevate** fatto | **eravate** andati/e |
      | loro | **avevano** fatto | **erano** andati/e |

      Выбор *avere / essere* и согласование причастия — как в passato prossimo.

      ## Когда употребляется

      Для действия, которое произошло **раньше** другого действия в прошлом:

      * *Francesca ha detto che l'anno scorso non **era andata** in vacanza.* — Франческа сказала, что в прошлом году не ездила в отпуск.
      * *Quando sono arrivata alla stazione, il treno **era** già **partito**.* — Когда я приехала на вокзал, поезд уже ушёл.
      * *Mio nonno parlava sempre dei viaggi che **aveva fatto**.*

      > 💡 Ось времени: trapassato prossimo → passato prossimo / imperfetto → сейчас.
    words:
      - "la traged`ia | трагедия"
      - "quindi | итак, значит"
      - "qualche giorno prima | несколько дней назад"
      - "non era un granché | так себе, ничего особенного"
      - "neppure | даже не"
      - "eppure | и всё же"
      - "la cr`itica | критика, рецензия"
      - "ormai | уже, теперь уже"
      - "la recensione | рецензия"
      - "decidere | решать"
    phrases:
      - "Avevamo deciso di andare al cinema. | Мы решили пойти в кино (ещё до того)."
      - "Il film non era un granché. | Фильм был так себе."
      - "Quando sono arrivata, il treno era già partito. | Когда я приехала, поезд уже ушёл."
    exercises:
      - type: choice
        level: 2
        q: "Quando sono arrivata, la lezione ___ già ___."
        options: ["è / iniziata", "era / iniziata", "aveva / iniziato", "sarà / iniziata"]
        answer: 1
      - type: choice
        level: 2
        q: "Trapassato от *mangiare* (io):"
        options: ["ho mangiato", "avevo mangiato", "ero mangiato", "mangiavo"]
        answer: 1
      - type: choice
        level: 2
        q: "Marco ha detto che ___ in Spagna l'anno prima."
        options: ["era stato", "aveva stato", "è stato", "sarà stato"]
        answer: 0
      - type: input
        level: 3
        q: "Non avevo fame perché ___ già ___ (mangiare). (trapassato)"
        answer: ["avevo mangiato"]
      - type: input
        level: 3
        q: "Le ragazze ___ (uscire) quando è arrivata la mamma. (trapassato)"
        answer: ["erano uscite", "erano già uscite"]
      - type: input
        level: 3
        q: "Voi ___ (vedere) quel film prima? (trapassato)"
        answer: ["avevate visto"]

  - slug: accordo-disaccordo
    title_it: "Sei d'accordo?"
    title_ru: "Согласие и несогласие"
    theory: |
      ## Как выразить мнение

      * **Secondo me…** / **Per me…** — По-моему…
      * **Penso che sia…** — Я думаю, что… (подробнее позже)
      * **Sei d'accordo?** — Ты согласна?

      | Согласие | Несогласие |
      |---|---|
      | **Sono d'accordo con te.** — Я с тобой согласна. | **Non sono d'accordo.** — Я не согласна. |
      | **Hai ragione!** — Ты права! | **Non hai ragione / Hai torto.** — Ты не права. |
      | **È vero!** — Это правда! | **Non è vero!** — Неправда! |
      | **Certo! / Sicuramente!** — Конечно! | **Ma no! / Per niente!** — Да нет же! / Вовсе нет! |
      | **Anche secondo me.** — Я тоже так считаю. | **Secondo me, invece…** — А по-моему… |
      | **Penso di sì.** — Думаю, да. | **Penso di no.** — Думаю, нет. |

      > 💡 Обратите внимание: «быть правым» по-итальянски — **avere ragione** (букв. «иметь разум»), а «ошибаться» — **avere torto**.
    words:
      - "d'accordo | согласен"
      - "l'accordo | согласие | m"
      - "il disaccordo | несогласие"
      - "avere ragione | быть правым"
      - "avere torto | быть неправым"
      - "bravissimo | молодец, отличный"
      - "la reg`ia | режиссура"
      - "l'attrice | актриса | f"
      - "sicuramente | конечно, наверняка"
      - "liberamente | свободно"
      - "secondo me | по-моему"
      - "penso di sì | думаю, да"
    phrases:
      - "Sei d'accordo? | Ты согласна?"
      - "Hai ragione! | Ты права!"
      - "Non sono d'accordo con te. | Я с тобой не согласна."
      - "Secondo me, il film è bellissimo. | По-моему, фильм прекрасный."
      - "Penso di no. | Думаю, нет."
    exercises:
      - type: choice
        level: 1
        q: "«Ты права!» —"
        options: ["Sei ragione!", "Hai ragione!", "Hai torto!", "Sei d'accordo!"]
        answer: 1
      - type: choice
        level: 1
        q: "Как сказать «по-моему»?"
        options: ["Secondo me", "Per me", "Оба варианта верны"]
        answer: 2
      - type: choice
        level: 2
        q: "Антоним к *avere ragione*:"
        options: ["avere torto", "avere fame", "essere d'accordo", "avere paura"]
        answer: 0
      - type: input
        level: 3
        q: "Переведите: «Я согласна» — Sono ___"
        answer: ["d'accordo", "d’accordo"]
      - type: input
        level: 3
        q: "Переведите: «Думаю, да» — Penso di ___"
        answer: ["sì", "si"]
      - type: order
        level: 3
        q: "Соберите: «Я с тобой не согласна.»"
        answer: "Non sono d'accordo con te."

  - slug: cinema-italiano
    title_it: "Il cinema italiano"
    title_ru: "Итальянское кино"
    theory: |
      ## Жанры

      **la commedia** (комедия), **il dramma / film drammatico** (драма), **il giallo / film poliziesco** (детектив), **il film d'avventura** (приключения), **il film d'amore** (мелодрама), **il film di fantascienza** (фантастика), **il film dell'orrore** (ужасы), **il cartone animato** (мультфильм), **il documentario** (документальный).

      ## О фильме

      **il titolo** (название), **la trama** (сюжет), **il regista** (режиссёр), **l'attore / l'attrice** (актёр / актриса), **la colonna sonora** (саундтрек), **il protagonista** (главный герой).

      * *Cosa danno al cinema stasera?* — Что сегодня показывают в кино?
      * *Il film è emozionante / noioso / divertente.*

      ## Великие режиссёры

      **Neorealismo** (после Второй мировой): Roberto Rossellini, Vittorio De Sica (*Ladri di biciclette*). **Federico Fellini** (*La dolce vita*, *8½*), **Sergio Leone** (вестерны), **Roberto Benigni** (*La vita è bella* — «Жизнь прекрасна»), **Paolo Sorrentino** (*La grande bellezza*). Композитор **Ennio Morricone** написал музыку к сотням фильмов.
