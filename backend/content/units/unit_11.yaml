id: 11
title_it: "A ritmo di musica"
title_ru: "В ритме музыки"
level: A2
icon: "🎵"
description: >
  Условное наклонение condizionale semplice и composto: желания, вежливые просьбы,
  советы, предположения, неподтверждённые новости и будущее в прошедшем.
  Музыка, фестиваль в Сан-Ремо и итальянские исполнители.
goals:
  - образовывать condizionale semplice (vorrei, potrei, mi piacerebbe)
  - вежливо просить, советовать и выражать желания
  - выражать несбывшееся желание с condizionale composto (sarei venuta)
  - передавать неподтверждённые новости
  - говорить о музыке и музыкальных инструментах

lessons:
  - slug: condizionale-semplice
    title_it: "Cosa gli chiederesti?"
    title_ru: "Условное наклонение: образование"
    theory: |
      ## Condizionale semplice

      Основа та же, что у **будущего времени**, но окончания другие: **-ei, -esti, -ebbe, -emmo, -este, -ebbero**.

      | | **parlare** | **leggere** | **preferire** |
      |---|---|---|---|
      | io | parl**erei** | legg**erei** | prefer**irei** |
      | tu | parl**eresti** | legg**eresti** | prefer**iresti** |
      | lui / lei | parl**erebbe** | legg**erebbe** | prefer**irebbe** |
      | noi | parl**eremmo** | legg**eremmo** | prefer**iremmo** |
      | voi | parl**ereste** | legg**ereste** | prefer**ireste** |
      | loro | parl**erebbero** | legg**erebbero** | prefer**irebbero** |

      * **-care / -gare** → **-cherei / -gherei**: *cercherei, pagherei*
      * **-ciare / -giare** → **-cerei / -gerei**: *comincerei, mangerei*

      ## Неправильные — как в futuro

      | | | |
      |---|---|---|
      | essere → **sarei** | avere → **avrei** | fare → **farei** |
      | andare → **andrei** | potere → **potrei** | dovere → **dovrei** |
      | volere → **vorrei** | venire → **verrei** | sapere → **saprei** |
      | vedere → **vedrei** | vivere → **vivrei** | rimanere → **rimarrei** |
      | bere → **berrei** | stare → **starei** | dare → **darei** |

      > 💡 Не путайте с будущим: *parlerò* (я буду говорить) — *parlerei* (я бы говорила); *parleremo* (будем) — *parleremmo* (говорили бы, двойная **m**!).
    words:
      - "il cantante | певец"
      - "la cantante | певица"
      - "sparito | исчезнувший"
      - "effettivamente | действительно"
      - "la tendenza | тенденция"
      - "spont`aneo | спонтанный"
      - "la vincitrice | победительница"
      - "l'opinione | мнение | f"
      - "altrui | чужой"
      - "l'assistente | ассистент | m"
      - "l'applicazione | приложение | f"
      - "sincero | искренний"
      - "chiedere | спрашивать"
    phrases:
      - "Cosa gli chiederesti? | Что бы ты у него спросила?"
      - "Vorrei un caffè. | Я бы хотела кофе."
      - "Mi piacerebbe andare in Italia. | Мне бы хотелось поехать в Италию."
      - "Sarebbe bello! | Было бы здорово!"
    exercises:
      - type: choice
        level: 1
        q: "Io ___ volentieri un gelato. (mangiare, condizionale)"
        options: ["mangerò", "mangerei", "mangiarei", "mangierei"]
        answer: 1
      - type: choice
