        q: "Condizionale от *volere* (io):"
        options: ["volerei", "vorrei", "vorrò", "voglio"]
        answer: 1
      - type: choice
        level: 2
        q: "Noi ___ in Sicilia. (andare, condizionale)"
        options: ["andremo", "andremmo", "anderemmo", "andassimo"]
        answer: 1
      - type: choice
        level: 2
        q: "Tu ___ venire con me? (potere, condizionale)"
        options: ["potresti", "potrai", "poteresti", "puoi"]
        answer: 0
      - type: choice
        level: 2
        q: "Loro ___ di più. (dovere, condizionale)"
        options: ["dovrebbero", "dovranno", "doverebbero", "dovrebbono"]
        answer: 0
      - type: input
        level: 2
        q: "Io ___ (essere) felice. (condizionale)"
        answer: ["sarei"]
      - type: input
        level: 3
        q: "Voi ___ (avere) tempo domani? (condizionale)"
        answer: ["avreste"]
      - type: input
