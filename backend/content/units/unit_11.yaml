      - "mettere da parte | откладывать"
      - "altrimenti | иначе, а то"
      - "sperare | надеяться"
      - "accadere | случаться"
    phrases:
      - "L'avrei visto volentieri, ma… | Я бы с удовольствием посмотрела, но…"
      - "Avresti dovuto dirmelo! | Тебе следовало мне это сказать!"
      - "Sarei venuta, ma ero malata. | Я бы пришла, но болела."
      - "Lascia stare! | Даже не спрашивай!"
      - "I biglietti erano esauriti. | Билеты были распроданы."
    exercises:
      - type: choice
        level: 2
        q: "Mi ___ venire, ma ero stanca."
        options: ["piacerebbe", "sarebbe piaciuto", "è piaciuto", "piacerà"]
        answer: 1
      - type: choice
        level: 2
        q: "Ero sicura che lui ___."
        options: ["verrà", "sarebbe venuto", "verrebbe", "viene"]
        answer: 1
        explain: "Будущее в прошедшем — condizionale composto."
      - type: choice
        level: 2
        q: "Tu ___ telefonarmi! (следовало бы — о прошлом)"
        options: ["dovresti", "avresti dovuto", "dovrai", "hai dovuto"]
        answer: 1
      - type: input
        level: 3
        q: "Io ___ (comprare) quella borsa, ma costava troppo. (condizionale composto)"
        answer: ["avrei comprato"]
      - type: input
        level: 3
        q: "Noi ___ (andare) al concerto, ma i biglietti erano esauriti. (condizionale composto)"
        answer: ["saremmo andati", "saremmo andate"]
      - type: input
        level: 3
        q: "Marco ha detto che ___ (arrivare) alle otto. (condizionale composto)"
        answer: ["sarebbe arrivato"]

  - slug: musica-italiana
    title_it: "Musica italiana"
    title_ru: "Музыка и инструменты"
    theory: |
      ## Инструменты

      **la chitarra** (гитара), **il pianoforte** (фортепиано), **il violino** (скрипка), **la batteria** (ударная установка), **la tastiera** (синтезатор), **il microfono** (микрофон), **le cuffie** (наушники).

      * *Suono la chitarra.* — Я играю на гитаре.
      * *Chi è il tuo cantante preferito?* — Кто твой любимый певец?

      ## Итальянская музыка

      Италия — родина **оперы**: Джузеппе Верди, Джакомо Пуччини, Джоаккино Россини. Знаменитые исполнители: **Luciano Pavarotti**, **Andrea Bocelli**, **Laura Pausini**, **Eros Ramazzotti**, **Adriano Celentano**, **Vasco Rossi**, группа **Måneskin** (победители Евровидения-2021).

      **Il cantautore / la cantautrice** — автор-исполнитель: сам пишет песни и поёт их. Это особая итальянская традиция: Лучо Далла, Фабрицио Де Андре, Франко Баттиато.

      > 💡 Многие музыкальные термины во всех языках — итальянские: *piano, forte, allegro, adagio, crescendo, soprano, tempo*.
