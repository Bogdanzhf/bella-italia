  - slug: orari-apertura
    title_it: "A che ora?"
    title_ru: "Часы работы"
    theory: |
      ## Часы работы

      * **A che ora apre / chiude la banca?** — Во сколько открывается / закрывается банк?
      * **Apre alle 8:30 e chiude alle 13:30.** — Открывается в 8:30 и закрывается в 13:30.
      * **L'ufficio postale è aperto dalle 8 alle 14.** — Почта открыта с 8 до 14.
      * **Il museo è chiuso il lunedì.** — Музей закрыт по понедельникам.

      > 💡 С часами всегда сочленённые предлоги: **alle** (в), **dalle … alle** (с … до). Но: *a mezzogiorno, all'una, dall'una*.

      В Италии многие магазины закрываются на обеденный перерыв примерно с 13 до 16 часов — особенно в небольших городах.

      ## Неуверенность

      * **Sei sicuro?** — Ты уверен? — **Non credo.** — Не думаю. — **Probabilmente sì.** — Вероятно, да.
    words:
      - "l'ufficio postale | почтовое отделение | m"
      - "cr`edere | верить, думать"
      - "chi`udere | закрывать"
      - "sicuro | уверенный"
      - "probabilmente | вероятно"
      - "pranzare | обедать"
      - "cenare | ужинать"
      - "l'orario di lavoro | рабочее время | m"
      - "urgente | срочный"
      - "lo sportello | окошко (кассы)"
      - "l'orario di apertura | часы работы | m"
      - "aperto | открытый"
      - "chiuso | закрытый"
      - "il canale | канал"
    phrases:
      - "A che ora apre la farmacia? | Во сколько открывается аптека?"
      - "È aperto dalle nove alle diciannove. | Открыто с девяти до девятнадцати."
      - "Il museo è chiuso il lunedì. | Музей закрыт по понедельникам."
      - "Non credo. | Не думаю."
    exercises:
      - type: choice
        level: 1
        q: "La banca apre ___ otto e mezza."
        options: ["a", "alle", "al", "le"]
        answer: 1
      - type: choice
