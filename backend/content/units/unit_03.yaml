id: 3
title_it: "In contatto"
title_ru: "На связи"
level: A1
icon: "💌"
description: >
  Сочленённые предлоги (al, della, nel…), часы работы, мебель и расположение предметов,
  c'è / ci sono, притяжательные mio, tuo, suo, частичный артикль, благодарность,
  месяцы и времена года, язык сообщений и интернета.
goals:
  - "сливать предлоги с артиклями: al, dello, nella, sui…"
  - спрашивать о часах работы и о местоположении
  - описывать комнату с помощью c'è / ci sono и предлогов места
  - "выражать принадлежность: il mio, la tua, il suo"
  - благодарить и отвечать на благодарность
  - называть месяцы, времена года и большие числа

lessons:
  - slug: preposizioni-articolate
    title_it: "Puoi andare al bar Eden"
    title_ru: "Сочленённые предлоги"
    theory: |
      ## Предлог + артикль = одно слово

      Предлоги **di, a, da, in, su** сливаются с определённым артиклем, образуя *preposizioni articolate*:

      | | + il | + lo | + l' | + la | + i | + gli | + le |
      |---|---|---|---|---|---|---|---|
      | **di** | del | dello | dell' | della | dei | degli | delle |
      | **a** | al | allo | all' | alla | ai | agli | alle |
      | **da** | dal | dallo | dall' | dalla | dai | dagli | dalle |
      | **in** | nel | nello | nell' | nella | nei | negli | nelle |
      | **su** | sul | sullo | sull' | sulla | sui | sugli | sulle |

      Предлоги **con, per, tra/fra** не сливаются: *con il, per la, tra i*.

      ## Когда нужен артикль?

      Если место названо **в общем** — простой предлог. Если оно **уточнено** — сочленённый:

      | Простой | Сочленённый |
      |---|---|
      | *a scuola* | *alla scuola americana* |
      | *in Italia* | *nell'Italia del Nord* |
      | *in ufficio* | *nell'ufficio del direttore* |
      | *a mezzogiorno* | *alle due* (часы) |
      | *da Maria* (имя) | *dal dottore* (профессия) |
      | *in Francia* | *negli Stati Uniti* (мн. ч.) |

      Всегда с артиклем: **al cinema, al bar, al ristorante, al mare, al supermercato**.
    words:
