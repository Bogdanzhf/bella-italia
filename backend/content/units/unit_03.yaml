      - "la pasta | макароны; паста"
      - "l'insalata | салат | f"
      - "la mela | яблоко"
    phrases:
      - "Grazie mille! — Di niente! | Огромное спасибо! — Не за что!"
      - "Ti ringrazio per gli appunti. | Спасибо тебе за конспекты."
      - "Vuoi dello zucchero? | Хочешь сахару?"
      - "Nessun problema! | Без проблем!"
    exercises:
      - type: choice
        level: 1
        q: "Как ответить на «Grazie mille!»?"
        options: ["Di niente!", "Buonasera!", "Mi dispiace!", "Ciao!"]
        answer: 0
      - type: choice
        level: 2
        q: "Vuoi ___ pane? (немного хлеба)"
