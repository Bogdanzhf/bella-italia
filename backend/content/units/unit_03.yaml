  - slug: possessivi
    title_it: "Di chi è?"
    title_ru: "Чей это? Притяжательные"
    theory: |
      ## Притяжательные прилагательные

      | | м. р. ед. | ж. р. ед. | м. р. мн. | ж. р. мн. |
      |---|---|---|---|---|
      | io — мой | il **mio** | la **mia** | i **miei** | le **mie** |
      | tu — твой | il **tuo** | la **tua** | i **tuoi** | le **tue** |
      | lui / lei — его / её | il **suo** | la **sua** | i **suoi** | le **sue** |
      | Lei — Ваш | il **Suo** | la **Sua** | i **Suoi** | le **Sue** |

      > 💡 Главное отличие от русского: притяжательное согласуется с **предметом**, а не с хозяином!
      > *il libro di Maria* → **il suo libro** (её книга — *suo*, потому что *libro* м. р.)
      > *la macchina di Luca* → **la sua macchina** (его машина — *sua*, потому что *macchina* ж. р.)

      Обычно перед притяжательным стоит **артикль**: *il mio libro, la tua borsa*. Со словом *casa* притяжательное ставится после, без артикля: *Venite a casa mia!*

      После *essere* артикль можно опустить: *Questo telefono è tuo? — No, non è mio, è suo.*

      **Di chi è?** — Чей это? — *È di Marco.* — Это Марко.
    words:
      - "il motorino | мопед"
      - "perciò | поэтому"
      - "di chi | чей"
      - "m`io | мой"
      - "t`uo | твой"
      - "s`uo | его, её; Ваш"
      - "il quaderno | тетрадь"
      - "la compagna di banco | соседка по парте"
    phrases:
      - "Di chi è questo zaino? | Чей это рюкзак?"
      - "È mio! | Мой!"
      - "Questa è la mia borsa. | Это моя сумка."
      - "Luca e la sua macchina. | Лука и его машина."
      - "Venite a casa mia domani? | Придёте ко мне домой завтра?"
    exercises:
      - type: choice
        level: 1
        q: "___ libro (мой)"
        options: ["la mia", "il mio", "i miei", "le mie"]
        answer: 1
      - type: choice
        level: 1
        q: "___ borsa (твоя)"
        options: ["il tuo", "la tua", "le tue", "i tuoi"]
        answer: 1
      - type: choice
        level: 2
        q: "Maria e ___ fratello. (её брат)"
        options: ["la sua", "il suo", "il sua", "la suo"]
        answer: 1
        explain: "Согласуем с fratello (м. р.): il suo."
      - type: choice
        level: 2
        q: "Luca e ___ macchina. (его машина)"
        options: ["il suo", "la sua", "la suo", "il sua"]
        answer: 1
      - type: choice
        level: 2
        q: "___ amici (мои друзья)"
        options: ["i mii", "i miei", "le mie", "i mio"]
        answer: 1
      - type: choice
        level: 3
        q: "Signora, è ___ questa borsa? (Ваша)"
        options: ["Sua", "Suo", "tua", "vostra"]
        answer: 0
      - type: input
