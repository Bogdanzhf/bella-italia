        options: ["dei", "degli", "delle", "dello"]
        answer: 1
      - type: input
        level: 3
        q: "Vuoi ___ zucchero? (частичный артикль)"
        answer: ["dello"]
      - type: input
        level: 3
        q: "Metto ___ olio nell'insalata."
        answer: ["dell'", "dell’"]
