id: 6
title_it: "A cena fuori"
title_ru: "Ужин в ресторане"
level: A2
icon: "🍝"
description: >
  Полная система притяжательных (nostro, vostro, loro), названия родственников,
  ресторан и меню, vorrei, mi piace / mi piacciono, volerci и metterci,
  quello и bello, приёмы пищи и посуда, итальянская кухня.
goals:
  - употреблять все притяжательные, в том числе с названиями родственников
  - рассказывать о своей семье
  - заказывать блюда в ресторане
  - говорить, что нравится, с mi piace / mi piacciono
  - "говорить, сколько времени нужно: ci vuole / ci vogliono, ci metto"
  - правильно ставить quello и bello перед существительным

lessons:
  - slug: possessivi-completi
    title_it: "È il suo compleanno"
    title_ru: "Притяжательные: полная таблица"
    theory: |
      ## Все притяжательные

      | | м. р. ед. | м. р. мн. | ж. р. ед. | ж. р. мн. |
      |---|---|---|---|---|
      | io | il mio | i miei | la mia | le mie |
      | tu | il tuo | i tuoi | la tua | le tue |
      | lui / lei / Lei | il suo | i suoi | la sua | le sue |
      | **noi** | **il nostro** | **i nostri** | **la nostra** | **le nostre** |
      | **voi** | **il vostro** | **i vostri** | **la vostra** | **le vostre** |
      | **loro** | **il loro** | **i loro** | **la loro** | **le loro** |

      **Loro** не изменяется: *il loro libro, la loro casa, i loro amici*.

      Как и раньше, притяжательное согласуется с **предметом**: *le amiche di Paolo → le **sue** amiche; la professoressa di Anna e Marco → la **loro** professoressa*.

      Притяжательное может заменять существительное: *La casa dei Bianchi è grande, **la nostra** è piccola.* — Дом Бьянки большой, наш — маленький.

      ## Подарки и поздравления

      * **Tanti auguri! / Buon compleanno!** — Поздравляю! / С днём рождения!
      * **Macché!** — Да что ты! Вовсе нет!
      * **Adoro i dolci!** — Обожаю сладкое!
    words:
      - "n`ostro | наш"
      - "v`ostro | ваш"
      - "loro | их"
      - "il locale | заведение"
      - "rom`antico | романтичный"
      - "come mai? | как так? почему?"
      - "discreto | скромный; неплохой"
      - "per caso | случайно"
      - "la madre | мать"
      - "il padre | отец"
      - "macché | да что ты, вовсе нет"
      - "adorare | обожать"
      - "dimenticare | забывать"
      - "la sciarpa | шарф"
      - "il volo | рейс, полёт"
      - "il cucciolo | щенок, детёныш"
      - "vivace | живой, бойкий"
      - "il sale | соль"
      - "salato | солёный"
      - "tanti auguri | поздравляю, всего наилучшего"
    phrases:
      - "Tanti auguri! | Поздравляю!"
      - "Buon compleanno! | С днём рождения!"
      - "Questi sono i nostri libri. | Это наши книги."
      - "La loro casa è molto bella. | Их дом очень красивый."
      - "Come mai? | Как так? Почему?"
    exercises:
      - type: choice
        level: 1
        q: "___ casa (наш)"
        options: ["il nostro", "la nostra", "le nostre", "nostra"]
        answer: 1
      - type: choice
        level: 1
        q: "___ amici (ваши)"
        options: ["i vostri", "le vostre", "il vostro", "vostri"]
        answer: 0
      - type: choice
        level: 2
        q: "Anna e Marco e ___ macchina (их)"
        options: ["la sua", "la loro", "le loro", "la lora"]
        answer: 1
      - type: choice
        level: 2
