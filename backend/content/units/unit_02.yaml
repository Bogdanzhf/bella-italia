  - slug: giorni-settimana
    title_it: "Quando sei libera?"
    title_ru: "Дни недели"
    theory: |
      ## Дни недели

      | | | |
      |---|---|---|
      | **lunedì** — понедельник | **giovedì** — четверг | **sabato** — суббота |
      | **martedì** — вторник | **venerdì** — пятница | **domenica** — воскресенье |
      | **mercoledì** — среда | | |

      Все дни недели **мужского** рода, кроме *la domenica*. Пишутся с маленькой буквы.

      * **lunedì** (без артикля) — в этот понедельник: *Lunedì vado a Roma.*
      * **il lunedì** (с артиклем) — по понедельникам: *Il lunedì vado in palestra.*

      ## Договариваемся о встрече

      * **Quando sei libera?** — Когда ты свободна?
      * **Sabato prossimo?** — В следующую субботу?
      * **Che ne dici di venerdì sera?** — Как насчёт вечера пятницы?
      * **Ho molto da fare.** — У меня много дел.
      * **Il mio compleanno è il 5 maggio.** — Мой день рождения 5 мая.
    words:
      - "lunedì | понедельник"
      - "martedì | вторник"
      - "mercoledì | среда"
      - "giovedì | четверг"
      - "venerdì | пятница"
      - "s`abato | суббота"
      - "dom`enica | воскресенье"
      - "il mese | месяц"
      - "la settimana | неделя"
      - "pr`ossimo | следующий"
      - "il compleanno | день рождения"
      - "imposs`ibile | невозможный"
      - "finalmente | наконец"
      - "l'agenda | ежедневник | f"
      - "abbastanza | достаточно"
      - "raccontare | рассказывать"
      - "inviare | отправлять"
    phrases:
      - "Quando sei libera? | Когда ты свободна?"
      - "Che ne dici di sabato? | Как насчёт субботы?"
      - "Ho molto da fare. | У меня много дел."
      - "Il sabato vado in piscina. | По субботам я хожу в бассейн."
      - "Ci vediamo lunedì prossimo! | Увидимся в следующий понедельник!"
    exercises:
      - type: choice
        level: 1
        q: "*Mercoledì* — это:"
        options: ["понедельник", "среда", "пятница", "четверг"]
        answer: 1
      - type: choice
        level: 1
        q: "Какой день недели женского рода?"
        options: ["sabato", "lunedì", "domenica", "venerdì"]
        answer: 2
      - type: choice
        level: 2
        q: "Как сказать «по воскресеньям я сплю долго»?"
        options: ["Domenica dormo molto.", "La domenica dormo molto.", "In domenica dormo molto.", "A domenica dormo molto."]
        answer: 1
        explain: "Регулярное действие — день недели с артиклем."
      - type: choice
        level: 2
        q: "Какой день идёт после *giovedì*?"
        options: ["mercoledì", "venerdì", "sabato", "martedì"]
        answer: 1
