  - slug: che-ora-e
    title_it: "Che ora è? / Che ore sono?"
    title_ru: "Который час?"
    theory: |
      ## Который час?

      Спросить можно двумя способами: **Che ora è?** или **Che ore sono?**

      Отвечаем **Sono le** + число (часы во множественном числе):
      * *Sono le tre.* — Три часа.
      * *Sono le otto e dieci.* — Восемь десять.

      Но в единственном числе:
      * **È l'una.** — Час.
      * **È mezzogiorno.** — Полдень.
      * **È mezzanotte.** — Полночь.

      ## Минуты

      | | |
      |---|---|
      | 8:15 | Sono le otto **e un quarto** |
      | 8:30 | Sono le otto **e mezzo** (e mezza, e trenta) |
      | 8:45 | Sono le nove **meno un quarto** |
      | 6:40 | Sono le sette **meno venti** |

      **A che ora…?** — Во сколько…? — **Alle otto.** — В восемь. **All'una.** — В час. **A mezzogiorno.** — В полдень.

      > 💡 В официальной речи (расписания, радио) используют 24-часовой формат: *Il treno parte alle diciotto e trenta* (18:30).
    words:
      - "l'ora | час | f"
      - "l'orologio | часы | m"
      - "l'orario | расписание; время | m"
      - "mezzogiorno | полдень"
      - "mezzanotte | полночь"
      - "il quarto | четверть"
      - "mezzo | половина"
      - "meno | без, минус"
      - "in ritardo | с опозданием"
      - "in anticipo | заранее, рано"
      - "in orario | вовремя"
      - "il programma | программа, передача"
    phrases:
      - "Che ora è? / Che ore sono? | Который час?"
      - "Sono le sette meno venti. | Без двадцати семь."
      - "È l'una e mezza. | Половина второго."
      - "A che ora parte il treno? | Во сколько отправляется поезд?"
      - "Siamo in ritardo! | Мы опаздываем!"
    exercises:
      - type: choice
        level: 1
        q: "Как спросить «Который час?»"
        options: ["Quanti anni hai?", "Che ore sono?", "Come stai?", "Quando sei libero?"]
        answer: 1
      - type: choice
        level: 1
        q: "1:00 —"
        options: ["Sono le una.", "È l'una.", "È una.", "Sono l'una."]
        answer: 1
      - type: choice
        level: 2
        q: "3:15 —"
        options: ["Sono le tre e un quarto.", "Sono le tre meno un quarto.", "È le tre e quindici.", "Sono tre e quarto."]
        answer: 0
      - type: choice
        level: 2
        q: "12:00 (днём) —"
        options: ["È mezzanotte.", "Sono le dodici notte.", "È mezzogiorno.", "Sono mezzogiorno."]
        answer: 2
      - type: choice
        level: 2
        q: "7:45 —"
        options: ["Sono le sette e tre quarti.", "Sono le otto meno un quarto.", "Оба варианта верны"]
        answer: 2
      - type: input
        level: 3
        q: "Напишите словами: 9:30 — Sono le nove e ___"
        answer: ["mezzo", "mezza", "trenta"]
      - type: input
        level: 3
        q: "Напишите: 5:40 — Sono le sei ___ venti"
        answer: ["meno"]
      - type: input
        level: 3
        q: "A che ora inizia il film? — ___ otto. (В восемь)"
        answer: ["alle"]

  - slug: mezzi-trasporto
    title_it: "I mezzi di trasporto urbano"
    title_ru: "Городской транспорт"
    theory: |
      ## Городской транспорт

      Основные виды: **l'autobus**, **il tram**, **la metropolitana** (*la metro*), **il treno**, **il taxi**, в Венеции — **il vaporetto** (речной трамвай).

      * **Prendo l'autobus / la metro.** — Я езжу на автобусе / на метро.
      * **Vado in autobus / in treno / in macchina / in bicicletta.** — Еду на автобусе / поезде / машине / велосипеде.
      * **Vado a piedi.** — Иду пешком.

      ## Билеты

      Билеты на автобус в Италии часто покупают заранее — в **tabaccheria** (табачная лавка), в **edicola** (газетный киоск), в автоматах или в приложении на **cellulare**. В транспорте билет нужно **convalidare / timbrare** — прокомпостировать. Для частых поездок есть **abbonamento** — проездной.

      > 💡 Не забывайте компостировать билет — за поездку без отметки штрафуют, даже если билет куплен!
    words:
