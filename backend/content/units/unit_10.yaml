        options: ["Daglielo!", "Dagli il regalo!", "Dalli il regalo!", "Gli da' il regalo!"]
        answer: 1
      - type: input
        level: 3
        q: "La lettera? Scrivi___ oggi!"
        answer: ["la"]
      - type: input
