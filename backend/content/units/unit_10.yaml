        q: "Как попросить о помощи?"
        options: ["Mi puoi dare una mano?", "Mi dai la mano?", "Hai una mano?", "Dove è la mano?"]
        answer: 0
      - type: input
        level: 3
        q: "Ci ___ (piacere) molto i tuoi amici. (passato prossimo)"
        answer: ["sono piaciuti"]
      - type: input
