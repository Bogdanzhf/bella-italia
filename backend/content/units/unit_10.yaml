        options: ["ascolti", "ascolta", "ascolto", "ascoltate"]
        answer: 1
      - type: choice
        level: 2
        q: "Anna, non ___! (parlare)"
        options: ["parla", "parli", "parlare", "parlate"]
        answer: 2
        explain: "Отрицательный императив для tu = non + инфинитив."
      - type: choice
        level: 2
        q: "Ragazzi, non ___ rumore! (fare)"
        options: ["fate", "fare", "fa'", "facciate"]
        answer: 0
      - type: choice
