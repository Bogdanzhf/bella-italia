    phrases:
      - "Le telefono più tardi. | Я ей позвоню позже."
      - "Gli ho regalato un libro. | Я подарила ему книгу."
      - "Mi presti la tua penna? | Одолжишь мне свою ручку?"
      - "Ti posso chiedere un favore? | Можно попросить тебя об одолжении?"
