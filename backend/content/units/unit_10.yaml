  - slug: favori-piacere-passato
    title_it: "Mi puoi dare una mano?"
    title_ru: "Просьбы. Piacere в прошедшем"
    theory: |
      ## Попросить об одолжении

      | Просьба | Согласие | Отказ |
      |---|---|---|
      | **Mi puoi dare una mano?** — Поможешь мне? | **Certo! / Volentieri!** | **Mi dispiace, ma…** |
      | **Mi fai un favore?** — Сделаешь одолжение? | **Come no!** — Конечно! | **Purtroppo non posso.** |
      | **Ti dispiace se…?** — Ты не против, если…? | **Ma figurati! / Fai pure!** — Пожалуйста! | **Veramente sì…** — Вообще-то против… |
      | **Mi presti…?** — Одолжишь мне…? | **Sì, prendilo pure!** — Бери! | |

      ## Piacere в passato prossimo

      *Piacere* образует прошедшее с **essere**, причастие согласуется с тем, **что** понравилось:

      * *Mi **è** sempre piaciut**a** la cioccolata.* (la cioccolata)
      * *Non ti **è** piaciut**o** il tiramisù?* (il tiramisù)
      * *Le **sono** piaciut**e** le scarpe.* (le scarpe)
      * *Ci **sono** piaciut**i** tutti i libri.* (i libri)
      * *Non gli **è** mai piaciut**o** andare a sciare.* (инфинитив → м. р. ед. ч.)
    words:
      - "l`ogico | логичный"
      - "il comportamento | поведение"
      - "lamentarsi | жаловаться"
      - "continuamente | постоянно"
      - "spostare | передвигать"
      - "dare una mano | помочь"
      - "fare un favore | сделать одолжение"
      - "come no! | конечно!"
      - "pure | же, пожалуйста (разрешение)"
    phrases:
      - "Mi puoi dare una mano? | Можешь мне помочь?"
      - "Mi fai un favore? | Сделаешь мне одолжение?"
      - "Ti dispiace se apro la finestra? | Ты не против, если я открою окно?"
      - "Ti è piaciuto il film? | Тебе понравился фильм?"
      - "Mi sono piaciute molto le tue foto. | Мне очень понравились твои фото."
    exercises:
      - type: choice
        level: 2
        q: "Ti ___ il film?"
        options: ["è piaciuto", "ha piaciuto", "è piaciuta", "sono piaciuti"]
        answer: 0
      - type: choice
        level: 2
        q: "Mi ___ le scarpe nuove."
        options: ["è piaciuto", "sono piaciute", "sono piaciuti", "ha piaciuto"]
        answer: 1
