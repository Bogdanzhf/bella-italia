      - "la statistica | статистика"
      - "la v`endita | продажа"
      - "il quotidiano | ежедневная газета"
    phrases:
      - "Prendilo pure! | Бери, пожалуйста!"
      - "Dimmi la verità! | Скажи мне правду!"
      - "Fallo subito! | Сделай это немедленно!"
      - "Dagli il libro! | Дай ему книгу!"
      - "Tienilo! | Оставь себе!"
    exercises:
      - type: choice
        level: 2
        q: "Il libro? ___ subito! (leggere, tu)"
        options: ["Lo leggi", "Leggilo", "Leggi lo", "Leggelo"]
        answer: 1
