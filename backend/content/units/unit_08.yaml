id: 8
title_it: "Fare la spesa"
title_ru: "Покупки продуктов"
level: A2
icon: "🧺"
description: >
  Прямые местоимения lo, la, li, le, частица ne, местоимения в сложных временах
  и с модальными глаголами, conoscere и sapere, конструкция ce l'ho, эмоции,
  количество и упаковки, магазины и рынки Италии.
goals:
  - заменять дополнение местоимениями lo, la, li, le, mi, ti…
  - "говорить о количестве с ne: ne prendo due chili"
  - "согласовывать причастие с местоимением: l'ho vista, li ho comprati"
  - различать conoscere и sapere
  - выражать радость, сожаление и разочарование
  - делать покупки в магазине и на рынке

lessons:
  - slug: pronomi-diretti
    title_it: "Al supermercato"
    title_ru: "Прямые местоимения"
    theory: |
      ## Что такое прямое местоимение

      Прямое местоимение заменяет дополнение **без предлога** (отвечает на вопрос *кого? что?*):
      *Leggo **il giornale**.* → ***Lo** leggo.* — Я её (газету) читаю.

      | | Безударная форма | Ударная форма |
      |---|---|---|
      | меня | **mi** | me |
      | тебя | **ti** | te |
      | его / её / Вас | **lo / la / La** | lui / lei / Lei |
      | нас | **ci** | noi |
      | вас | **vi** | voi |
      | их (м. / ж.) | **li / le** | loro |

      **Безударная** форма стоит **перед** глаголом: *Carlo **mi** saluta.*
      **Ударная** — **после** глагола, для выделения: *Carlo saluta **me*** (именно меня).

      * *Compri **le mele**? — Sì, **le** compro.*
      * *Vedi **i ragazzi**? — No, non **li** vedo.*
      * *Signora, **La** posso aiutare?* — Синьора, могу я Вам помочь?

      > 💡 **Lo** может заменять целую фразу: *A che ora comincia il film? — Non **lo** so.* — Не знаю (этого).
    words:
      - "lo yogurt | йогурт"
      - "la mela | яблоко"
      - "uguale | одинаковый; всё равно"
      - "di meno | меньше; дешевле"
      - "la pera | груша"
      - "la banana | банан"
      - "la calor`ia | калория"
      - "il limone | лимон"
      - "integrale | цельнозерновой"
      - "l'uovo | яйцо | m; мн. ч. le uova"
      - "la confezione | упаковка"
      - "il sacchetto | пакет"
      - "meno male | слава богу, хорошо что"
      - "a memoria | наизусть"
      - "convincere | убеждать"
      - "accompagnare | провожать, сопровождать"
      - "fumare | курить"
      - "il litro | литр"
    phrases:
      - "Il latte? Lo compro io! | Молоко? Я его куплю!"
      - "Le mele le prendi tu? | Яблоки возьмёшь ты?"
      - "Non lo so. | Не знаю."
      - "Signora, La posso aiutare? | Синьора, могу Вам помочь?"
