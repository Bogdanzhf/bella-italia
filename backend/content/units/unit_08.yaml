  - slug: emozioni
    title_it: "Che bello!"
    title_ru: "Радость, сожаление, досада"
    theory: |
      ## Как выразить эмоции

      | Радость | Сожаление | Досада |
      |---|---|---|
      | **Che bello!** — Как здорово! | **Che peccato!** — Как жаль! | **Che rabbia!** — Какая досада! |
      | **Che bella sorpresa!** — Какой сюрприз! | **Mi dispiace!** — Мне жаль! | **Accidenti!** — Чёрт возьми! |
      | **Fantastico! / Evviva!** — Здорово! / Ура! | **Purtroppo…** — К сожалению… | **Mannaggia!** — Вот досада! |
      | **Sono contentissima!** — Я так рада! | **Peccato che…** — Жаль, что… | **Uffa!** — Ну вот! (раздражение) |

      > 💡 Конструкция **Che + прилагательное / существительное!** очень удобна: *Che bello! Che fortuna! Che noia! Che freddo!*
    words:
      - "la gioia | радость"
      - "il ramm`arico | сожаление"
      - "il disappunto | разочарование"
      - "che rabbia! | какая досада!"
      - "accidenti! | чёрт возьми!"
      - "la sorpresa | сюрприз"
      - "mannaggia! | вот досада!"
      - "la borsa di studio | стипендия"
      - "la noia | скука"
      - "che peccato! | как жаль!"
      - "evviva! | ура!"
    phrases:
      - "Che bello! | Как здорово!"
      - "Che bella sorpresa! | Какой приятный сюрприз!"
      - "Che peccato! | Как жаль!"
      - "Accidenti, ho perso il treno! | Чёрт, я опоздала на поезд!"
      - "Ho vinto una borsa di studio! | Я получила стипендию!"
