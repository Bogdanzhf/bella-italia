      - "il contenitore | ёмкость"
    phrases:
      - "Quanto ne vuole? | Сколько Вам (этого)?"
      - "Ne vorrei mezzo chilo. | Мне бы полкило."
      - "Vorrei tre etti di prosciutto. | Мне бы 300 граммов ветчины."
