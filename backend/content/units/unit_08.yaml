  - slug: pronomi-tempi-composti
    title_it: "Dove li hai comprati?"
    title_ru: "Местоимения в прошедшем. Conoscere и sapere"
    theory: |
      ## Местоимения в passato prossimo

      С **lo, la, li, le** причастие **обязательно** согласуется:

      * *Hai visto il film? — Sì, **l'ho visto**.*
      * *Dove hai comprato questa camicetta? — **L'ho comprata** a Roma.*
      * *Hai visto i ragazzi? — Sì, **li ho incontrati** al bar.*
      * *Hai le chiavi? — **Le ho messe** sul tavolo.*

      *Lo* и *la* перед *ho, hai, ha, hanno* и гласной сокращаются до **l'**.

      С **ne** причастие согласуется с количеством: *Hai comprato le mele? — Sì, **ne** ho comprat**i** due chili.* *La torta? **Ne** ho mangiat**e** due fette.*

      С **mi, ti, ci, vi** согласование необязательно: *Chiara, chi **ti** ha accompagnat**o/a**?*

      ## Conoscere и sapere — «знать»

      | **conoscere** | **sapere** |
      |---|---|
      | знать человека, место: *Conosci Marco? Conosco Roma.* | знать факт, информацию: *Sai dove abita?* |
      | | уметь: *So nuotare.* — Я умею плавать. |

      В прошедшем значение меняется:
      * *Ho conosciuto Stefania alla festa.* — Я **познакомилась** со Стефанией.
      * *Ho saputo che…* — Я **узнала**, что…
      * *Conoscevo già Franco.* — Я уже **была знакома** с Франко.
    words:
      - "unico | единственный"
      - "il matrimonio | свадьба, брак"
      - "la decisione | решение"
      - "il resto | остаток; сдача"
      - "conoscere | знать (кого-то), знакомиться"
      - "la camicetta | блузка"
      - "nuotare | плавать"
    phrases:
      - "Dove li hai comprati? | Где ты их купила?"
      - "L'ho conosciuta alla festa di Carla. | Я познакомилась с ней на празднике у Карлы."
      - "Hai saputo la notizia? | Ты слышала новость?"
      - "Sa tutto di tutti. | Знает всё обо всех."
    exercises:
      - type: choice
        level: 2
        q: "Hai visto Maria? — Sì, l'ho ___ ieri."
        options: ["visto", "vista", "visti", "viste"]
        answer: 1
      - type: choice
        level: 2
        q: "Hai comprato i biglietti? — Sì, li ho ___."
        options: ["comprato", "comprata", "comprati", "comprate"]
        answer: 2
      - type: choice
        level: 2
        q: "___ dove abita Luca?"
        options: ["Conosci", "Sai", "Conosce", "Sapi"]
        answer: 1
      - type: choice
        level: 2
        q: "___ mio fratello?"
        options: ["Sai", "Conosci", "Sapete", "Sa"]
        answer: 1
      - type: input
        level: 3
        q: "Hai letto le lettere? — Sì, le ho ___. (leggere)"
        answer: ["lette"]
      - type: input
        level: 3
        q: "Hai mangiato la torta? — Sì, ___ mangiata. (местоимение + avere)"
        answer: ["l'ho", "l’ho"]
      - type: input
        level: 3
        q: "Quante pizze hai fatto? — Ne ho ___ tre. (fare)"
        answer: ["fatte"]
      - type: input
