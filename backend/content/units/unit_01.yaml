  - slug: come-e
    title_it: "Com'è?"
    title_ru: "Какой он? Внешность и характер"
    theory: |
      ## Описываем человека

      **Com'è?** — Какой он / она? Отвечаем с глаголом **essere** (рост, фигура, характер) или **avere** (глаза, волосы):

      * *È **alta**, **magra** e **bruna**.* — Она высокая, стройная, брюнетка.
      * *Ha i capelli **lunghi** e **ricci**.* — У неё длинные кудрявые волосы.
      * *È **allegro** e **simpatico**.* — Он весёлый и приятный.

      ## Пары-антонимы

      | | |
      |---|---|
      | alto — высокий | basso — низкий |
      | magro — худой | grasso — полный |
      | giovane — молодой | anziano — пожилой |
      | bello — красивый | brutto — некрасивый |
      | simpatico — приятный | antipatico — неприятный |
      | allegro — весёлый | triste — грустный |
      | gentile — вежливый | scortese — невежливый |

      > 💡 *Bellissimo* — очень красивый. Суффикс **-issimo** усиливает прилагательное: *bravissimo, simpaticissima*.
    words:
      - "magro | худой, стройный"
      - "grasso | полный, толстый"
      - "bruno | темноволосый, брюнет"
      - "anziano | пожилой"
      - "brutto | некрасивый"
      - "antip`atico | неприятный"
      - "allegro | весёлый"
      - "triste | грустный"
      - "scortese | невежливый"
      - "bell`issimo | очень красивый"
      - "riccio | кудрявый"
      - "liscio | прямой (о волосах)"
      - "il viso | лицо"
      - "il naso | нос"
      - "la testa | голова"
      - "la bocca | рот"
      - "l'`uomo | мужчина, человек | m"
      - "la donna | женщина"
      - "la storia | история"
      - "il carattere | характер"
      - "l'aspetto | внешность | m"
      - "insieme | вместе"
      - "migliore | лучший"
      - "la gonna | юбка"
      - "il cane | собака"
    phrases:
      - "Com'è il tuo ragazzo? | Какой твой парень?"
      - "È alto, bruno e molto simpatico. | Он высокий, темноволосый и очень приятный."
      - "La mia migliore amica è allegra. | Моя лучшая подруга весёлая."
    exercises:
      - type: choice
        level: 1
        q: "Антоним к *alto*:"
        options: ["magro", "basso", "brutto", "triste"]
        answer: 1
      - type: choice
        level: 1
        q: "Антоним к *allegro*:"
        options: ["triste", "giovane", "gentile", "grasso"]
        answer: 0
      - type: choice
        level: 2
        q: "Giulia ___ i capelli lunghi."
        options: ["è", "ha", "sono", "hanno"]
        answer: 1
      - type: choice
        level: 2
        q: "Marco e Luca sono ___."
        options: ["simpatico", "simpatici", "simpatiche", "simpatica"]
        answer: 1
      - type: choice
        level: 2
        q: "Le ragazze sono ___."
        options: ["allegri", "allegre", "allegra", "allegro"]
        answer: 1
      - type: input
        level: 3
        q: "Антоним к *giovane*:"
        answer: ["anziano", "vecchio"]
      - type: input
        level: 3
        q: "Антоним к *simpatico*:"
        answer: ["antipatico"]
      - type: input
        level: 3
        q: "Переведите: «Она очень красивая.» — È ___."
        answer: ["bellissima", "molto bella"]
      - type: order
        level: 3
        q: "Соберите: «У Анны карие глаза и светлые волосы.»"
        answer: "Anna ha gli occhi marroni e i capelli biondi."

