  - slug: saluti
    title_it: "Ciao Maria!"
    title_ru: "Приветствия и прощания"
    theory: |
      ## Как поздороваться

      | Неформально (на «ты») | Формально (на «Вы») |
      |---|---|
      | **Ciao!** — Привет! / Пока! | **Buongiorno!** — Добрый день! (до ~17:00) |
      | **Salve!** — Здравствуй(те)! (нейтрально) | **Buonasera!** — Добрый вечер! |
      | **Come stai?** — Как дела? | **Come sta?** — Как Ваши дела? |
      | **Come va?** — Как дела? (и так, и так) | |

      ## Как попрощаться

      * **Ciao! / Ci vediamo!** — Пока! / Увидимся!
      * **Arrivederci!** — До свидания!
      * **ArrivederLa!** — До свидания! (очень вежливо, одному человеку на «Вы»)
      * **Buonanotte!** — Спокойной ночи!
      * **A domani! / A presto!** — До завтра! / До скорого!

      ## Как ответить на «Как дела?»

      **Benissimo!** (отлично) → **Bene, grazie!** (хорошо, спасибо) → **Così così.** (так себе) → **Male.** (плохо)

      > 💡 *Buonasera* в Италии говорят уже с середины дня, примерно после 16–17 часов. *Buonanotte* — только перед сном.
    words:
      - "il signore | господин, мужчина"
      - "la signora | госпожа, женщина"
      - "il dottore | доктор"
      - "salve | здравствуй(те)"
      - "arrivederci | до свидания"
      - "arrivederLa | до свидания (вежливо)"
      - "buonasera | добрый вечер"
      - "buonanotte | спокойной ночи"
      - "bene | хорошо"
      - "male | плохо"
      - "così così | так себе"
      - "benissimo | отлично"
      - "formale | официальный, формальный"
      - "informale | неформальный"
      - "l'università | университет | f"
      - "la biblioteca | библиотека"
      - "la serata | вечер (время)"
      - "la disc`oteca | дискотека"
      - "la sera | вечер"
      - "la mattina | утро"
    phrases:
      - "Buongiorno, signora Rossi! Come sta? | Добрый день, синьора Росси! Как Ваши дела?"
      - "Bene, grazie. E Lei? | Хорошо, спасибо. А Вы?"
