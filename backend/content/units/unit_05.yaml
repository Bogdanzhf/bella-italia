  - slug: natale-in-italia
    title_it: "Natale in Italia"
    title_ru: "Праздники и традиции"
    theory: |
      ## Главные праздники

      | Праздник | Дата | Традиции |
      |---|---|---|
      | **Natale** — Рождество | 25 декабря | *il presepe* (рождественский вертеп), *il panettone* и *il pandoro*, игра *la tombola* |
      | **Capodanno** — Новый год | 1 января | *il cenone* (праздничный ужин), фейерверки, чечевица на счастье |
      | **Epifania** | 6 января | ведьма **Befana** приносит детям сладости в чулке |
      | **Carnevale** — Карнавал | февраль | маски, Венецианский карнавал |
      | **Pasqua** — Пасха | весной | пирог *la colomba*, шоколадные яйца |
      | **Ferragosto** | 15 августа | разгар летних отпусков, вся Италия на море |

      **Babbo Natale** — Дед Мороз (Санта-Клаус). Поздравления: **Buon Natale!** (С Рождеством!), **Buon anno!** (С Новым годом!), **Buona Pasqua!** (С Пасхой!), **Buone feste!** (С праздниками!).

      > 💡 Пословица: *Natale con i tuoi, Pasqua con chi vuoi* — «Рождество — с семьёй, Пасху — с кем хочешь».
    words:
      - "Babbo Natale | Дед Мороз, Санта-Клаус"
