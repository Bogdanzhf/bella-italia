      - "il m`eteo | прогноз погоды"
      - "la temperatura | температура"
      - "vari`abile | переменный"
      - "il temporale | гроза"
      - "la neve | снег"
      - "la n`ebbia | туман"
      - "calmo | спокойный"
      - "mosso | неспокойный (о море)"
      - "d`ebole | слабый"
      - "in aumento | повышается"
      - "in diminuzione | понижается"
      - "nevicare | идти (о снеге)"
      - "piovere | идти (о дожде)"
      - "coperto | пасмурный"
      - "la penisola | полуостров"
      - "il mattino | утро"
    phrases:
      - "Che tempo fa oggi? | Какая сегодня погода?"
      - "Fa freddo e tira vento. | Холодно и ветрено."
      - "Domani pioverà. | Завтра будет дождь."
      - "Oggi c'è il sole! | Сегодня солнечно!"
    exercises:
      - type: choice
        level: 1
        q: "*Nevica* означает:"
        options: ["идёт дождь", "идёт снег", "ветрено", "туман"]
        answer: 1
      - type: choice
        level: 1
        q: "«Жарко» —"
        options: ["È caldo.", "Fa caldo.", "Ha caldo.", "C'è caldo."]
        answer: 1
      - type: choice
        level: 2
        q: "«Ветрено» —"
        options: ["Fa vento.", "Tira vento.", "È vento.", "Ha vento."]
        answer: 1
      - type: choice
        level: 2
        q: "*La nebbia* — это:"
        options: ["небо", "туман", "облако", "гроза"]
        answer: 1
      - type: input
        level: 3
        q: "Domani ___ (piovere). (futuro)"
        answer: ["pioverà"]
      - type: input
        level: 3
        q: "Переведите: «Какая погода?» — Che tempo ___?"
        answer: ["fa"]
      - type: input
        level: 3
        q: "Переведите: «гроза» — il ___"
        answer: ["temporale"]
