        - "Gianna: Ecco i nostri passaporti. A che ora dobbiamo lasciare la camera? | Вот наши паспорта. Во сколько нужно освободить номер?"
        - "Receptionist: Entro le undici. Se avete bisogno di qualcosa, chiamate la reception. Buona permanenza! | До одиннадцати. Если что-то понадобится, звоните на ресепшен. Приятного отдыха!"
