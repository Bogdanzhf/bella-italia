  - slug: praktikum-5
    kind: practice
    title_it: "Esercizi: futuro semplice"
    title_ru: "Практикум: будущее время"
    theory: |
      ## Памятка

      **futuro semplice:** инфинитив без последней -e + окончания **-ò, -ai, -à, -emo, -ete, -anno**.
      У глаголов на **-are** a → **e**: *parlare → parl**e**rò*.

      | | parlare | prendere | partire |
      |---|---|---|---|
      | io | parlerò | prenderò | partirò |
      | tu | parlerai | prenderai | partirai |
      | lui | parlerà | prenderà | partirà |
      | noi | parleremo | prenderemo | partiremo |
      | voi | parlerete | prenderete | partirete |
      | loro | parleranno | prenderanno | partiranno |

      * **-care / -gare → -cherò / -gherò**: *cercherò, pagherò*; **-ciare / -giare → -cerò / -gerò**: *comincerò, mangerò*.
      * **Неправильные:** essere → **sarò**, avere → **avrò**, fare → **farò**, andare → **andrò**, venire → **verrò**, potere → **potrò**, dovere → **dovrò**, volere → **vorrò**, vedere → **vedrò**, sapere → **saprò**, stare → **starò**, dare → **darò**, bere → **berrò**, rimanere → **rimarrò**.

      Futuro также выражает **предположение**: *Dov'è Marco? — **Sarà** a casa.* — Наверное, он дома.

      **Se** + futuro → futuro: *Se **farà** bel tempo, **andremo** al mare.*
    exercises:
      - type: choice
        level: 1
        q: "Domani io ___ (parlare) con il direttore."
        options: ["parlerò", "parlarò", "parlero", "parlerei"]
        answer: 0
        hint: "-are → основа **parler-** + **-ò** (с ударением на конце)."
        ru: "Завтра я поговорю с директором."
      - type: choice
        level: 1
        q: "L'anno prossimo noi ___ (andare) in Sicilia."
        options: ["andremo", "anderemo", "andiamo", "andremmo"]
        answer: 0
        hint: "andare — неправильный: основа **andr-** + -emo."
        ru: "В следующем году мы поедем на Сицилию."
      - type: choice
        level: 2
        q: "Stasera ___ (essere) molto stanca."
        options: ["sarò", "essererò", "sono stata", "saro"]
        answer: 0
        hint: "essere в будущем — **sarò, sarai, sarà**…"
        ru: "Сегодня вечером я буду очень уставшей."
      - type: choice
        level: 2
        q: "Chi ha suonato alla porta? — ___ il postino."
        options: ["Sarà", "È stato", "Sarebbe", "Sono"]
        answer: 0
        hint: "Предположение «наверное, это…» → **futuro**: Sarà."
        ru: "Кто позвонил в дверь? — Наверное, почтальон."
      - type: input
        level: 2
        q: "Io ___ (pagare) con la carta."
        answer: ["pagherò"]
        hint: "-gare → **-gherò**: h сохраняет звук [г]."
        ru: "Я заплачу картой."
      - type: input
        level: 2
        q: "Quando ___ (cominciare) il corso?"
        answer: ["comincerà"]
        hint: "-ciare → **-cerà**: i перед e не нужна."
        ru: "Когда начнётся курс?"
      - type: input
        level: 3
        q: "I miei amici ___ (venire) a trovarmi a giugno."
        answer: ["verranno"]
        hint: "venire → основа **verr-** + -anno."
        ru: "Мои друзья приедут ко мне в гости в июне."
      - type: input
        level: 3
        q: "Tu ___ (avere) tempo domani?"
        answer: ["avrai"]
        hint: "avere → основа **avr-** + -ai."
        ru: "У тебя будет время завтра?"
      - type: cloze
        level: 3
        q: "Поставьте глаголы в futuro."
        text: "Se [[farà]] (fare) bel tempo, [[andremo]] (andare) al mare. Se [[pioverà]] (piovere), [[resteremo]] (restare) a casa."
        hint: "После **se** о будущем — тоже futuro. fare → farà, andare → andremo, piovere → pioverà, restare → resteremo (a → e)."
        ru: "Если будет хорошая погода, поедем на море. Если пойдёт дождь, останемся дома."
      - type: error
        level: 2
        q: "Найдите ошибку."
        text: "Domani noi {{mangiaremo=>mangeremo}} al ristorante."
        hint: "У глаголов на -are в futuro a меняется на **e**; -giare теряет i."
        ru: "Завтра мы будем ужинать в ресторане."
      - type: error
        level: 3
        q: "Найдите ошибку."
        text: "Quando arriverai a Roma, mi {{telefoni=>telefonerai}}?"
        hint: "Обе части фразы о будущем → futuro в обеих."
        ru: "Когда приедешь в Рим, ты мне позвонишь?"
      - type: match
        level: 2
        q: "Соедините инфинитив и futuro (io)"
        hint: "Все формы неправильные — основа укорачивается или меняется."
        pairs:
          - ["fare", "farò"]
          - ["vedere", "vedrò"]
          - ["volere", "vorrò"]
          - ["dovere", "dovrò"]
          - ["rimanere", "rimarrò"]
        ru: "делать, видеть, хотеть, быть должным, оставаться — «я буду…»"
      - type: order
        level: 2
        q: "Соберите: «Завтра я тебе позвоню.»"
        answer: "Domani ti telefonerò."
        hint: "Время + местоимение ti + глагол в futuro."
        ru: "Завтра я тебе позвоню."

  - slug: autovalutazione-5
    kind: review
    title_it: "Che cosa hai imparato?"
    title_ru: "Самопроверка: юнит 5"
    theory: |
      ## Что вы уже умеете

      * говорить о планах, давать обещания и прогнозы в **futuro semplice**: *andrò, farò, sarò, avrò, verrò*;
      * говорить о действии, которое закончится раньше другого: **futuro composto**;
      * покупать билет на поезд и понимать объявления;
      * рассказывать о погоде и праздниках.
    exercises:
      - type: match
        level: 1
        q: "Соедините инфинитив и будущее время (io)"
        pairs:
          - ["essere", "sarò"]
          - ["avere", "avrò"]
          - ["andare", "andrò"]
          - ["venire", "verrò"]
          - ["fare", "farò"]
      - type: odd
        level: 1
        q: "Найдите лишнее: что не погода?"
        options: ["piove", "nevica", "tira vento", "binario"]
        answer: 3
      - type: odd
        level: 2
        q: "Найдите лишнее: что не связано с поездом?"
        options: ["binario", "carrozza", "controllore", "tenda"]
        answer: 3
      - type: error
        level: 2
        q: "Найдите ошибку."
        text: "Domani {{piovrà=>pioverà}} tutto il giorno."
      - type: error
        level: 3
        q: "Найдите ошибку."
        text: "Noi {{mangieremo=>mangeremo}} al ristorante."
      - type: cloze
        level: 3
        q: "Заполните пропуски."
        text: "L'anno prossimo [[andrò]] (andare) in Italia. Se [[farà]] (fare) bel tempo, [[andremo]] (andare) al mare."
