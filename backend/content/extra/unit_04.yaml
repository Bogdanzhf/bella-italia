lessons_before:
  - slug: dialogo-fine-settimana
    kind: dialogue
    title_it: "Com'è andato il weekend?"
    title_ru: "Как прошли выходные?"
    dialogue:
      title: "Lunedì mattina"
      scene: "Понедельник. София и Джанна встречаются в баре перед работой и рассказывают о выходных."
      lines:
        - "Gianna: Buongiorno, Sofia! Allora, come hai passato il fine settimana? | Доброе утро, София! Ну, как ты провела выходные?"
        - "Sofia: Benissimo! Sabato sono andata al lago con Lorenzo. | Отлично! В субботу я ездила на озеро с Лоренцо."
        - "Gianna: Ah, sì? E che cosa avete fatto? | Да? И что вы делали?"
        - "Sofia: Abbiamo fatto una passeggiata e abbiamo mangiato un gelato. Poi siamo tornati in treno. | Мы погуляли и съели мороженое. Потом вернулись на поезде."
        - "Gianna: Che bello! Io purtroppo ho lavorato tutto il sabato. | Как здорово! А я, к сожалению, всю субботу работала."
        - "Sofia: Mi dispiace! E domenica? | Жаль! А в воскресенье?"
        - "Gianna: Domenica sono rimasta a casa, ho letto un libro e ho dormito tanto. | В воскресенье я осталась дома, читала книгу и много спала."
        - "Sofia: Anche questo è bello! Hai già fatto colazione? | Это тоже хорошо! Ты уже позавтракала?"
        - "Gianna: No, non ancora. Prendo un cappuccino e un cornetto. E tu? | Нет, ещё нет. Возьму капучино и круассан. А ты?"
        - "Sofia: Per me un caffè macchiato, grazie. | Мне кофе маккьято, спасибо."
    words:
      - "il weekend | выходные"
      - "tutto il sabato | всю субботу"
      - "non ancora | ещё нет"
    phrases:
      - "Come hai passato il fine settimana? | Как ты провела выходные?"
      - "Che cosa avete fatto? | Что вы делали?"
      - "Hai già fatto colazione? | Ты уже позавтракала?"
      - "Non ancora. | Ещё нет."
    exercises:
      - type: tf
        level: 1
        ref: dialogue
        q: "Верно или неверно?"
        items:
          - ["Sabato Sofia è andata al lago.", true]
          - ["Gianna ha lavorato sabato.", true]
          - ["Domenica Gianna è andata al cinema.", false]
          - ["Gianna ha già fatto colazione.", false]
      - type: choice
        level: 2
        audio: "Domenica sono rimasta a casa e ho dormito tanto."
        q: "🎧 Что Джанна делала в воскресенье?"
        options: ["работала", "оставалась дома и спала", "ездила на море", "ходила в кино"]
        answer: 1
      - type: cloze
        level: 2
        ref: dialogue
        q: "Вставьте вспомогательный глагол."
        text: "Sofia [[è]] andata al lago. Hanno fatto una passeggiata e [[hanno]] mangiato un gelato. Gianna [[ha]] lavorato."
      - type: dialog
        level: 2
        q: "Восстановите диалог."
        lines:
          - "Che cosa hai fatto ieri?"
          - "Sono andata al cinema."
          - "Che film hai visto?"
          - "Una commedia italiana. Bellissima!"

lessons_after:
  - slug: bar-italiano
    kind: culture
    title_it: "Il bar e il caffè"
    title_ru: "Итальянский бар и кофе"
    reading:
      title: "Un caffè, per favore!"
      photo: p-espresso-bar
      text: |
        Per gli italiani il bar è un luogo speciale. La mattina molti fanno colazione al bar: un cappuccino e un cornetto, in piedi al banco.
        Il caffè italiano è l'espresso: piccolo, forte e caldo. Gli italiani lo bevono velocemente, anche tre o quattro volte al giorno.
        Il cappuccino si beve solo la mattina, mai dopo pranzo!
        A casa molti italiani preparano il caffè con la moka, una piccola caffettiera inventata nel 1933.
        Al bar spesso prima si paga alla cassa, poi si dà lo scontrino al barista.
      ru: |
        Для итальянцев бар — особое место. Утром многие завтракают в баре: капучино и круассан, стоя у стойки.
        Итальянский кофе — это эспрессо: маленький, крепкий и горячий. Итальянцы пьют его быстро, даже три-четыре раза в день.
        Капучино пьют только утром, никогда после обеда!
        Дома многие итальянцы варят кофе в моке — маленькой кофеварке, изобретённой в 1933 году.
        В баре часто сначала платят на кассе, потом отдают чек бармену.
      glossary:
        - "in piedi | стоя"
        - "velocemente | быстро"
        - "la caffettiera | кофеварка"
        - "inventato | изобретённый"
    photos: [p-moka]
    words:
      - "in piedi | стоя"
      - "la caffettiera | кофеварка"
      - "la moka | мока (гейзерная кофеварка)"
      - "velocemente | быстро"
    exercises:
      - type: tf
        level: 1
        ref: reading
        q: "Верно или неверно?"
        items:
          - ["Gli italiani bevono il cappuccino dopo cena.", false]
          - ["L'espresso è piccolo e forte.", true]
          - ["La moka è una caffettiera.", true]
          - ["Al bar si paga sempre alla fine.", false]
      - type: choice
        level: 1
        img: p-moka
        q: "Что на фото?"
        options: ["la moka", "il cornetto", "lo scontrino", "la tazza"]
        answer: 0
      - type: cloze
        level: 2
        ref: reading
        q: "Заполните пропуски по тексту."
        text: "La moka è stata inventata nel [[1933]]. Prima si paga alla [[*cassa/banco/moka]], poi si dà lo [[scontrino]] al barista."

  - slug: praktikum-4
    kind: practice
    title_it: "Esercizi: passato prossimo — essere o avere?"
    title_ru: "Практикум: passato prossimo — essere или avere?"
    theory: |
      ## Памятка

      **passato prossimo** = **avere / essere** в настоящем + **причастие** (participio passato).

      Причастие: -are → **-ato** (parlato), -ere → **-uto** (venduto), -ire → **-ito** (dormito).

      ## Как выбрать вспомогательный глагол

      **ESSERE**, если глагол:
      1. означает **движение из точки в точку** или **остановку**: andare, venire, arrivare, partire, tornare, uscire, entrare, salire, scendere, restare, rimanere;
      2. означает **изменение состояния**: nascere, morire, diventare, crescere;
      3. **возвратный**: alzarsi, lavarsi, divertirsi;
      4. а также: essere, stare, piacere, costare, succedere, sembrare.

      **AVERE** — все остальные, особенно если у глагола есть **прямое дополнение** (что? кого?): *Ho mangiato una pizza.*

      С **essere** причастие **согласуется** с подлежащим: *Sofia è andat**a**, i ragazzi sono partit**i**, le amiche sono uscit**e**.*

      **Частые неправильные причастия:** fare → **fatto**, dire → **detto**, leggere → **letto**, scrivere → **scritto**, prendere → **preso**, mettere → **messo**, vedere → **visto**, aprire → **aperto**, chiudere → **chiuso**, venire → **venuto**, essere → **stato**, nascere → **nato**, rimanere → **rimasto**, bere → **bevuto**.

      > 💡 Тест: можно ли спросить «что?» после глагола? Да → обычно **avere**. Это перемещение или изменение состояния? → **essere**.
    exercises:
      - type: choice
        level: 1
        q: "Ieri Sofia ___ al cinema."
        options: ["ha andato", "è andata", "è andato", "ha andata"]
        answer: 1
        hint: "andare — движение → **essere**; Sofia — девушка → причастие на **-a**."
        ru: "Вчера София ходила в кино."
      - type: choice
        level: 1
        q: "Abbiamo ___ una pizza buonissima."
        options: ["mangiato", "mangiati", "mangiata", "mangiare"]
        answer: 0
        hint: "С **avere** причастие обычно **не согласуется** с подлежащим — остаётся на -o."
        ru: "Мы съели очень вкусную пиццу."
      - type: choice
        level: 2
        q: "Le ragazze ___ partite alle otto."
        options: ["hanno", "sono", "sono state", "hanno state"]
        answer: 1
        hint: "partire — движение (уезжать) → **essere**; причастие partite уже согласовано (ж. мн.)."
        ru: "Девушки уехали в восемь."
      - type: choice
        level: 2
        q: "Mio nonno ___ nel 1945."
        options: ["ha nato", "è nato", "è nata", "ha nascito"]
        answer: 1
        hint: "nascere — изменение состояния → **essere**; причастие неправильное — **nato**."
        ru: "Мой дедушка родился в 1945 году."
      - type: choice
        level: 2
        q: "Quanto ___ costato il biglietto?"
        options: ["ha", "è", "hai", "sono"]
        answer: 1
        hint: "costare в прошедшем — всегда с **essere**: è costato."
        ru: "Сколько стоил билет?"
      - type: cloze
        level: 2
        q: "Поставьте ho / sono (или другую форму essere / avere)."
        text: "Stamattina mi [[sono]] alzata alle sette, [[ho]] fatto colazione e [[sono]] uscita. Poi [[ho]] preso l'autobus."
        hint: "alzarsi (возвратный) и uscire (движение) — essere; fare colazione и prendere l'autobus — есть «что?» → avere."
        ru: "Сегодня утром я встала в семь, позавтракала и вышла. Потом села на автобус."
      - type: input
        level: 1
        q: "fare → ___ (причастие)"
        answer: ["fatto"]
        hint: "Неправильное причастие — запоминайте: **fatto**."
        ru: "делать → сделанный"
      - type: input
        level: 2
        q: "Hai ___ (leggere) il giornale?"
        answer: ["letto"]
        hint: "leggere → **letto** (неправильное)."
        ru: "Ты прочитала газету?"
      - type: input
        level: 2
        q: "Chi ha ___ (aprire) la finestra?"
        answer: ["aperto"]
        hint: "aprire → **aperto** (неправильное)."
        ru: "Кто открыл окно?"
      - type: input
        level: 3
        q: "Siamo ___ (rimanere) a casa tutto il giorno. (мы — девушки)"
        answer: ["rimaste"]
        hint: "rimanere → rimasto; с essere согласуем: ж. р. мн. ч. → **rimaste**."
        ru: "Мы весь день оставались дома."
      - type: input
        level: 3
        q: "Gianna ha ___ (scrivere) una lettera."
        answer: ["scritto"]
        hint: "scrivere → **scritto** (неправильное); с avere — без согласования."
        ru: "Джанна написала письмо."
      - type: error
        level: 2
        q: "Найдите ошибку."
        text: "Ieri Marco {{ha=>è}} tornato tardi."
        hint: "tornare — возвращение (движение) → essere."
        ru: "Вчера Марко вернулся поздно."
      - type: error
        level: 2
        q: "Найдите ошибку."
        text: "Sofia è {{arrivato=>arrivata}} a Milano."
        hint: "С essere причастие согласуется с подлежащим: Sofia — ж. р."
        ru: "София приехала в Милан."
      - type: error
        level: 3
        q: "Найдите ошибку."
        text: "Abbiamo {{prenduto=>preso}} un taxi."
        hint: "prendere — неправильное причастие."
        ru: "Мы взяли такси."
      - type: odd
        level: 2
        q: "Найдите лишнее: какой глагол спрягается с AVERE?"
        options: ["andare", "partire", "mangiare", "arrivare"]
        answer: 2
        hint: "Три глагола обозначают перемещение (essere), один — действие с дополнением «что?»."
        ru: "идти, уезжать, есть, приезжать"
      - type: match
        level: 2
        q: "Соедините инфинитив и причастие"
        hint: "Все причастия неправильные — вспомните список в памятке."
        pairs:
          - ["dire", "detto"]
          - ["vedere", "visto"]
          - ["mettere", "messo"]
          - ["chiudere", "chiuso"]
          - ["venire", "venuto"]
        ru: "сказать, видеть, класть, закрывать, приходить — причастия"

  - slug: autovalutazione-4
    kind: review
    title_it: "Che cosa hai imparato?"
    title_ru: "Самопроверка: юнит 4"
    theory: |
      ## Что вы уже умеете

      * рассказывать о прошлом в **passato prossimo** с **avere** и **essere**;
      * знать неправильные причастия: *fatto, detto, visto, preso, letto, scritto, stato, venuto…*;
      * ставить наречия **già, mai, ancora, appena** и употреблять **ci** («туда»);
      * заказывать в баре.
    exercises:
      - type: match
        level: 1
        q: "Соедините глагол и причастие"
        pairs:
          - ["fare", "fatto"]
          - ["vedere", "visto"]
          - ["prendere", "preso"]
          - ["scrivere", "scritto"]
          - ["venire", "venuto"]
      - type: odd
        level: 2
        q: "Найдите лишнее: какой глагол образует прошедшее с avere?"
        options: ["andare", "partire", "mangiare", "arrivare"]
        answer: 2
      - type: odd
        level: 2
        q: "Найдите лишнее: что не заказывают в баре?"
        options: ["cappuccino", "cornetto", "spremuta", "binario"]
        answer: 3
      - type: error
        level: 2
        q: "Найдите ошибку."
        text: "Ieri Maria {{ha=>è}} andata al cinema."
      - type: error
        level: 3
        q: "Найдите ошибку."
        text: "Abbiamo {{prenduto=>preso}} un taxi."
      - type: error
        level: 3
        q: "Найдите ошибку."
        text: "Le ragazze sono {{arrivati=>arrivate}} tardi."
      - type: cloze
        level: 3
        q: "Поставьте глаголы в passato prossimo."
        text: "Ieri io [[ho mangiato]] (mangiare) una pizza e poi [[sono tornata|sono tornato]] (tornare) a casa."
      - type: choice
        level: 2
        audio: "Non sono mai stata a Parigi."
        q: "🎧 Была ли женщина в Париже?"
        options: ["да, много раз", "да, один раз", "никогда"]
        answer: 2

