lessons_before:
  - slug: dialogo-cinema
    kind: dialogue
    title_it: "Quando eri piccola…"
    title_ru: "Когда ты была маленькой…"
    dialogue:
      title: "Dopo il film"
      scene: "София и Лоренцо выходят из кинотеатра после старого итальянского фильма."
      lines:
        - "Lorenzo: Allora, ti è piaciuto il film? | Ну как, тебе понравился фильм?"
        - "Sofia: Moltissimo! Mi ha ricordato la mia infanzia. | Очень! Он напомнил мне моё детство."
        - "Lorenzo: Davvero? Com'era la tua infanzia? | Правда? Каким было твоё детство?"
        - "Sofia: Abitavo in una piccola città vicino a Mosca. D'estate andavo sempre dai nonni in campagna. | Я жила в маленьком городке под Москвой. Летом я всегда ездила к бабушке с дедушкой в деревню."
        - "Lorenzo: E che cosa facevi lì? | И что ты там делала?"
        - "Sofia: Giocavo con il cane, leggevo le favole e la sera guardavamo i film tutti insieme. | Играла с собакой, читала сказки, а вечером мы все вместе смотрели фильмы."
        - "Lorenzo: Che bello! Io invece ero un bambino molto vivace. Una volta sono caduto dall'albero! | Как здорово! А я был очень непоседливым ребёнком. Однажды я упал с дерева!"
        - "Sofia: Oddio! E che cosa è successo? | О боже! И что случилось?"
        - "Lorenzo: Niente di grave, per fortuna. Ma la mamma si è arrabbiata tantissimo! | Ничего серьёзного, к счастью. Но мама ужасно рассердилась!"
        - "Sofia: Ahah, ci credo! | Ха-ха, верю!"
    words:
      - "l'infanzia | детство | f"
      - "ricordare | напоминать, помнить"
      - "niente di grave | ничего серьёзного"
      - "per fortuna | к счастью"
    phrases:
      - "Ti è piaciuto il film? | Тебе понравился фильм?"
      - "Com'era la tua infanzia? | Каким было твоё детство?"
      - "Niente di grave. | Ничего серьёзного."
      - "Ci credo! | Верю! Ещё бы!"
    exercises:
      - type: tf
        level: 1
        ref: dialogue
        q: "Верно или неверно?"
        items:
          - ["A Sofia non è piaciuto il film.", false]
          - ["D'estate Sofia andava dai nonni.", true]
          - ["Lorenzo era un bambino tranquillo.", false]
          - ["Lorenzo è caduto dall'albero.", true]
      - type: choice
        level: 2
        audio: "D'estate andavo sempre dai nonni in campagna."
        q: "🎧 Куда девочка ездила летом?"
        options: ["на море", "к бабушке с дедушкой в деревню", "в горы", "в Москву"]
        answer: 1
      - type: cloze
        level: 2
        ref: dialogue
        q: "Imperfetto или passato prossimo?"
        text: "Da bambina Sofia [[*giocava/ha giocato]] con il cane. Una volta Lorenzo [[*è caduto/cadeva]] dall'albero."
      - type: dialog
        level: 2
        q: "Восстановите диалог."
        lines:
          - "Dove abitavi da bambino?"
          - "Abitavo a Bologna."
          - "E che cosa facevi d'estate?"
          - "Andavo sempre al mare."

lessons_after:
  - slug: cinema-italiano-cultura
    kind: culture
    title_it: "Cinecittà e il grande cinema"
    title_ru: "Чинечитта и великое кино"
    reading:
      title: "La fabbrica dei sogni"
      photo: p-cinecitta
      text: |
        Cinecittà è un grande studio cinematografico a Roma. È nata nel 1937 e qui sono stati girati più di tremila film.
        Qui ha lavorato Federico Fellini, uno dei registi più famosi del mondo. Il suo film "La dolce vita" racconta Roma negli anni Sessanta: c'è una scena famosa nella Fontana di Trevi.
        Dopo la Seconda guerra mondiale nasce il Neorealismo: i registi raccontavano la vita vera delle persone semplici.
        Anche oggi il cinema italiano vince premi importanti: Roberto Benigni e Paolo Sorrentino hanno vinto l'Oscar.
        Per questo Cinecittà si chiama anche "la fabbrica dei sogni".
      ru: |
        Чинечитта — большая киностудия в Риме. Она появилась в 1937 году, здесь сняли больше трёх тысяч фильмов.
        Здесь работал Федерико Феллини, один из самых известных режиссёров мира. Его фильм «Сладкая жизнь» рассказывает о Риме шестидесятых: в нём знаменитая сцена в фонтане Треви.
        После Второй мировой войны родился неореализм: режиссёры рассказывали о настоящей жизни простых людей.
        И сегодня итальянское кино получает важные премии: Роберто Бениньи и Паоло Соррентино получили «Оскар».
        Поэтому Чинечитту называют ещё «фабрикой грёз».
      glossary:
        - "girare un film | снимать фильм"
        - "la scena | сцена"
        - "semplice | простой"
        - "la fabbrica dei sogni | фабрика грёз"
    words:
      - "girare un film | снимать фильм"
      - "la scena | сцена"
      - "il sogno | мечта, сон"
      - "semplice | простой"
    exercises:
      - type: tf
        level: 1
        ref: reading
        q: "Верно или неверно?"
        items:
          - ["Cinecittà è a Milano.", false]
          - ["Fellini ha girato \"La dolce vita\".", true]
          - ["Il Neorealismo nasce dopo la guerra.", true]
      - type: choice
        level: 2
        ref: reading
        q: "Почему Чинечитту называют «фабрикой грёз»?"
        options: ["Там делают игрушки", "Там сняли тысячи фильмов", "Там живут актёры", "Это парк развлечений"]
        answer: 1
      - type: match
        level: 2
        q: "Соедините режиссёра и факт"
        pairs:
          - ["Federico Fellini", "La dolce vita"]
          - ["Roberto Benigni", "La vita è bella"]
          - ["Paolo Sorrentino", "La grande bellezza"]

  - slug: praktikum-7
    kind: practice
    title_it: "Esercizi: imperfetto o passato prossimo?"
    title_ru: "Практикум: imperfetto или passato prossimo?"
    theory: |
      ## Памятка

      **imperfetto:** основа инфинитива + **-vo, -vi, -va, -vamo, -vate, -vano**: *parla**vo**, legge**vi**, dormi**va***.
      Неправильные: essere → **ero, eri, era, eravamo, eravate, erano**; fare → **facevo**; dire → **dicevo**; bere → **bevevo**.

      ## Когда что

      | **imperfetto** — «фон», процесс | **passato prossimo** — событие, результат |
      |---|---|
      | описание: *Era una bella giornata.* | одно законченное действие: *Ho visto un film.* |
      | привычка в прошлом: *Da bambina **andavo** al mare ogni estate.* | действие с точным сроком: *Ieri **sono andata** al mare.* |
      | состояние, возраст, время, погода: *Avevo dieci anni. Erano le tre.* | последовательность событий: *Sono entrata, ho salutato e mi sono seduta.* |
      | два параллельных процесса: ***Mentre** cucinavo, lui **leggeva**.* | |

      **Прерванное действие:** процесс — imperfetto, то, что его прервало, — passato prossimo:
      *Mentre **dormivo**, **è suonato** il telefono.* — Пока я спала, зазвонил телефон.

      **Слова-подсказки:** *mentre, di solito, ogni giorno, sempre, da bambino* → imperfetto · *ieri, una volta, all'improvviso, tre giorni fa, poi, alla fine* → passato prossimo.

      **trapassato prossimo** (avevo / ero + причастие) — действие **до** другого в прошлом: *Quando sono arrivata, il treno **era già partito**.*
    exercises:
      - type: choice
        level: 1
        q: "Da bambina ___ (giocare) sempre in giardino."
        options: ["giocavo", "ho giocato", "gioco", "giocherò"]
        answer: 0
        hint: "**Привычка в прошлом** (sempre, da bambina) → imperfetto."
        ru: "В детстве я всегда играла в саду."
      - type: choice
        level: 1
        q: "Ieri sera ___ (vedere) un film bellissimo."
        options: ["vedevo", "ho visto", "vedo", "avevo visto"]
        answer: 1
        hint: "**Одно законченное действие** в определённый момент (ieri sera) → passato prossimo."
        ru: "Вчера вечером я посмотрела прекрасный фильм."
      - type: choice
        level: 2
        q: "Mentre ___ (cucinare), è arrivato Marco."
        options: ["ho cucinato", "cucinavo", "cucino", "avevo cucinato"]
        answer: 1
        hint: "Процесс, который был **прерван** (mentre…) → imperfetto."
        ru: "Пока я готовила, пришёл Марко."
      - type: choice
        level: 2
        q: "Mentre leggevo, all'improvviso ___ (andare) via la luce."
        options: ["andava", "è andata", "va", "era andata"]
        answer: 1
        hint: "Внезапное событие (all'improvviso), которое прервало чтение → passato prossimo."
        ru: "Пока я читала, вдруг погас свет."
      - type: choice
        level: 2
        q: "Quando ero piccola, ___ (avere) un cane."
        options: ["ho avuto", "avevo", "avrò", "ho"]
        answer: 1
        hint: "Состояние / обладание в прошлом на фоне → imperfetto."
        ru: "Когда я была маленькой, у меня была собака."
      - type: choice
        level: 3
        q: "Quando siamo arrivati alla stazione, il treno ___ già ___ ."
        options: ["è … partito", "era … partito", "partiva … —", "ha … partito"]
        answer: 1
        hint: "Поезд ушёл **раньше**, чем мы пришли → trapassato prossimo: era partito."
        ru: "Когда мы приехали на вокзал, поезд уже ушёл."
      - type: input
        level: 1
        q: "Io ___ (essere) stanca. (imperfetto)"
        answer: ["ero"]
        hint: "essere в imperfetto неправильный: **ero**, eri, era…"
        ru: "Я была уставшей."
      - type: input
        level: 2
        q: "Che cosa ___ (fare) voi ogni domenica? (imperfetto)"
        answer: ["facevate"]
        hint: "fare → основа **face-** + -vate."
        ru: "Что вы делали каждое воскресенье?"
      - type: input
        level: 2
        q: "Mio nonno ___ (dire) sempre: «Chi va piano va sano». (imperfetto)"
        answer: ["diceva"]
        hint: "dire → основа **dice-** + -va."
        ru: "Мой дедушка всегда говорил: «Тише едешь — дальше будешь»."
      - type: cloze
        level: 3
        q: "Выберите время."
        text: "[[*Era/È stata]] una bella giornata. Il sole [[*splendeva/ha splenduto]] e io [[*camminavo/ho camminato]] nel parco. All'improvviso [[*ho visto/vedevo]] Lorenzo."
        hint: "Описание фона (погода, процесс) — imperfetto; внезапное событие — passato prossimo."
        ru: "Был прекрасный день. Светило солнце, и я гуляла в парке. Вдруг я увидела Лоренцо."
      - type: cloze
        level: 3
        q: "Поставьте глаголы в нужное время."
        text: "Ieri [[sono uscita]] (uscire, я) alle otto, [[ho preso]] (prendere) l'autobus e [[sono arrivata]] (arrivare) in ufficio."
        hint: "Цепочка законченных событий одно за другим → passato prossimo. uscire и arrivare — с essere (говорит девушка), prendere — с avere."
        ru: "Вчера я вышла в восемь, села на автобус и приехала в офис."
      - type: error
        level: 2
        q: "Найдите ошибку."
        text: "Quando ero piccola, ogni giorno {{vado=>andavo}} a scuola a piedi."
        hint: "ogni giorno в прошлом (quando ero piccola) — привычка → imperfetto."
        ru: "Когда я была маленькой, я каждый день ходила в школу пешком."
      - type: error
        level: 2
        q: "Найдите ошибку."
        text: "Ieri {{guardavo=>ho guardato}} un film e poi sono andata a letto."
        hint: "Последовательность законченных действий (poi) → passato prossimo."
        ru: "Вчера я посмотрела фильм, а потом легла спать."
      - type: tf
        level: 2
        q: "Какое время подсказывает слово? Верно или неверно?"
        hint: "Привычка и фон — imperfetto; разовое событие с точным моментом — passato prossimo."
        items:
          - ["«di solito» подсказывает imperfetto.", true]
          - ["«ieri» подсказывает imperfetto.", false]
          - ["«ogni estate» подсказывает imperfetto.", true]
          - ["«all'improvviso» подсказывает passato prossimo.", true]
        ru: "di solito — обычно, ieri — вчера, ogni estate — каждое лето, all'improvviso — вдруг."
      - type: order
        level: 2
        q: "Соберите: «Пока я спала, зазвонил телефон.»"
        answer: "Mentre dormivo, è suonato il telefono."
        hint: "Процесс (mentre + imperfetto), затем событие в passato prossimo."
        ru: "Пока я спала, зазвонил телефон."

  - slug: autovalutazione-7
    kind: review
    title_it: "Che cosa hai imparato?"
    title_ru: "Самопроверка: юнит 7"
    theory: |
      ## Что вы уже умеете

      * описывать прошлое и привычки в **imperfetto**: *ero, avevo, facevo, andavo*;
      * выбирать между **imperfetto** (фон, процесс) и **passato prossimo** (событие);
      * говорить о том, что было раньше другого события: **trapassato prossimo**;
      * соглашаться и не соглашаться; говорить о кино.
    exercises:
      - type: match
        level: 1
        q: "Соедините глагол и форму imperfetto (io)"
        pairs:
          - ["essere", "ero"]
          - ["fare", "facevo"]
          - ["bere", "bevevo"]
          - ["dire", "dicevo"]
      - type: odd
        level: 1
        q: "Найдите лишнее: что не жанр фильма?"
        options: ["commedia", "giallo", "orrore", "regista"]
        answer: 3
      - type: error
        level: 2
        q: "Найдите ошибку."
        text: "Da piccola {{abito=>abitavo}} sempre con i nonni."
      - type: error
        level: 2
        q: "Найдите ошибку."
        text: "Mentre {{guardo=>guardavo}} la TV, è suonato il telefono."
      - type: error
        level: 3
        q: "Найдите ошибку."
        text: "Quando sono arrivata, il treno {{è=>era}} già partito."
      - type: cloze
        level: 3
        q: "Заполните пропуски."
        text: "Hai [[ragione]], sono d'accordo! — Io invece non sono [[d'accordo]]: secondo [[me]] il film è noioso."
      - type: choice
        level: 2
        audio: "Ogni domenica andavamo al cinema con papà."
        q: "🎧 Это разовое событие или привычка?"
        options: ["разовое событие", "привычка в прошлом"]
        answer: 1

