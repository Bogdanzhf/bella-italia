  - slug: comparativi
    kind: grammar
    title_it: "Più alto di me"
    title_ru: "Сравнительная степень: più / meno, di или che"
    theory: |
      ## Больше или меньше: più / meno

      Сравнение строится как в русском «более / менее … чем»:

      | | |
      |---|---|
      | **più** + прилагательное + **di / che** | более … чем |
      | **meno** + прилагательное + **di / che** | менее … чем |

      * *Marco è **più alto di** Luca.* — Марко выше Луки.
      * *Roma è **meno cara di** Milano.* — Рим менее дорогой, чем Милан.

      ## Di или che? Главное правило

      **DI** — когда сравниваем **два предмета / человека** по одному качеству (перед существительным, именем, местоимением):

      * *Sofia è più giovane **di** Gianna.* · *Il treno è più veloce **dell'**autobus.* (di + l' = dell')
      * *Sei più bravo **di** me.* — после di ставим ударное местоимение: **me, te, lui, lei, noi, voi, loro**.

      **CHE** — когда сравниваем **два качества, два действия, два места или времени** у одного предмета:

      * *Il film è più noioso **che** divertente.* — два прилагательных
      * *Mi piace più leggere **che** guardare la TV.* — два инфинитива
      * *A Roma fa più caldo **che** a Milano.* — перед предлогом
      * *Ho più amiche **che** amici.* — два существительных без артикля в количестве

      > 💡 Проверка: если после «чем» стоит **предлог, глагол или второе прилагательное** → **che**. Если **существительное или местоимение** (и сравниваются два предмета) → **di**.

      ## Равенство: tanto … quanto / così … come

      * *Luca è **(tanto) alto quanto** Marco.* — Лука такого же роста, как Марко.
      * *Sei **(così) bella come** tua madre.* — Ты так же красива, как твоя мама.

      Первое слово (tanto / così) часто опускают: *bella come il sole*.

      ## «Чем я думала»

      Перед глаголом используйте **di quello che**:

      * *È più bello **di quello che** credevo.* — Это красивее, чем я думала.
    words:
      - "alto | высокий"
      - "basso | низкий"
      - "giovane | молодой"
