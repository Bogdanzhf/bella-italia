        - "Gianna: Sì, ma è anche più rumorosa. Dormire lì è più difficile che dormire in periferia. | Да, но и шумнее. Спать там труднее, чем на окраине."
        - "Sofia: Il secondo appartamento è tranquillo quanto una biblioteca, però è lontanissimo dal lavoro. | Вторая квартира тихая, как библиотека, но очень далеко от работы."
        - "Gianna: Secondo me è meglio vivere vicino al lavoro. Il tempo è la cosa più preziosa! | По-моему, лучше жить рядом с работой. Время — самое ценное!"
        - "Sofia: Hai ragione. È la scelta migliore. Prendo quello a Trastevere! | Ты права. Это лучший выбор. Беру ту, что в Трастевере!"
    words:
