        level: 1
        ref: dialogue
        q: "Верно или неверно?"
        hint: "Перечитайте диалог: ищите слова **più** (более) и **meno** (менее) — они показывают, что с чем сравнивают."
        items:
          - ["L'appartamento a Trastevere è più grande dell'altro.", false]
