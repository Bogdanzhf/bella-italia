  - slug: superlativi
    kind: grammar
    title_it: "Il più bello del mondo"
    title_ru: "Превосходная степень и особые формы"
    theory: |
      ## Самый … : superlativo relativo

      **артикль + (существительное) + più / meno + прилагательное + di / tra**

      * *Roma è **la città più bella d'**Italia.* — Рим — самый красивый город Италии.
      * *È **il più alto della** classe.* — Он самый высокий в классе.
      * *È **il meno caro di** tutti.* — Он самый недорогой из всех.

      > 💡 Второй артикль не нужен: **la città più bella** (а не *la città la più bella*).

      ## Очень … : superlativo assoluto

      1. **-issimo** вместо последней гласной: *bello → bell**issimo***, *caro → car**issima***, *facile → facil**issimo***.
         -co / -go → **-chissimo / -ghissimo**: *simpatico → simpati**chissimo***, *lungo → lun**ghissimo***.
      2. **molto / assai / davvero** + прилагательное: *molto bello*.
      3. Повтор (разговорное): *piano piano* — потихоньку; приставки **stra- / super-**: *stracotto, superveloce*.

      ## Особые формы

      | | сравн. степень | превосх. относ. | превосх. абсол. |
      |---|---|---|---|
      | buono | **migliore** (più buono) | il migliore | **ottimo** (buonissimo) |
      | cattivo | **peggiore** (più cattivo) | il peggiore | **pessimo** (cattivissimo) |
      | grande | **maggiore** (più grande) | il maggiore | **massimo** (grandissimo) |
      | piccolo | **minore** (più piccolo) | il minore | **minimo** (piccolissimo) |

      *mio fratello maggiore* — мой старший брат · *la sorella minore* — младшая сестра.

      ## Migliore или meglio?

      * **migliore / peggiore** — **прилагательные**: стоят при существительном, изменяются по числу: *un libro migliore, le idee migliori*.
      * **meglio / peggio** — **наречия**: при глаголе, не изменяются: *Canti **meglio** di me.* · *Oggi sto **peggio**.* · *È **meglio** partire presto.*

      | наречие | сравн. | превосх. |
      |---|---|---|
      | bene | **meglio** | benissimo |
      | male | **peggio** | malissimo |
      | molto | **più** | moltissimo |
      | poco | **meno** | pochissimo |
