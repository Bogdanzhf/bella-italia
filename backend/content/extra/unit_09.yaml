  - slug: praktikum-9
    kind: practice
    title_it: "Esercizi: verbi riflessivi e si impersonale"
    title_ru: "Практикум: возвратные глаголы и безличное si"
    theory: |
      ## Памятка

      **Возвратные глаголы** — частица перед глаголом: **mi, ti, si, ci, vi, si**.

      | alzarsi | mettersi | vestirsi |
      |---|---|---|
      | mi alzo | mi metto | mi vesto |
      | ti alzi | ti metti | ti vesti |
      | si alza | si mette | si veste |
      | ci alziamo | ci mettiamo | ci vestiamo |
      | vi alzate | vi mettete | vi vestite |
      | si alzano | si mettono | si vestono |

      * В **passato prossimo** — всегда **essere** + согласование: *Mi sono alzat**a** alle sette. Ci siamo divertit**i**.*
      * С модальным — частица перед модальным или слитно с инфинитивом: ***Mi** devo alzare* = *Devo alzar**mi***.
      * **Взаимные**: *Ci vediamo domani. Si sono conosciuti a Roma.* — Увидимся / Они познакомились.

      **Безличное si** = «у нас / здесь / люди делают»: *In Italia **si mangia** bene.* · *Qui non **si fuma**.*
      С существительным во мн. ч. глагол — во мн. ч.: ***Si vendono** case.*

      > 💡 Различайте: *lavo la macchina* (мою машину) — *mi lavo* (моюсь) — *mi lavo le mani* (мою руки).
    exercises:
      - type: choice
        level: 1
        q: "La mattina io ___ alle sette."
        options: ["mi alzo", "si alzo", "alzo", "mi alza"]
        answer: 0
        hint: "io → частица **mi** + глагол в форме io: mi alz**o**."
        ru: "Утром я встаю в семь."
      - type: choice
        level: 1
        q: "Come ___ chiamano i tuoi amici?"
        options: ["si", "ci", "vi", "ti"]
        answer: 0
        hint: "loro (i tuoi amici) → частица **si**."
        ru: "Как зовут твоих друзей?"
      - type: choice
        level: 2
        q: "Ieri sera noi ___ molto alla festa."
        options: ["abbiamo divertito", "ci siamo divertiti", "si siamo divertiti", "ci abbiamo divertiti"]
        answer: 1
        hint: "Возвратный глагол в прошедшем → **essere** + согласование; noi → ci."
        ru: "Вчера вечером мы очень повеселились на празднике."
      - type: choice
        level: 2
        q: "Sofia ___ il vestito rosso."
        options: ["si è messa", "ha messo si", "si ha messo", "è messa"]
        answer: 0
        hint: "mettersi (надевать) в прошедшем: si + **è** + mess**a** (Sofia)."
        ru: "София надела красное платье."
      - type: input
        level: 2
        q: "Voi a che ora ___ (svegliarsi)?"
        answer: ["vi svegliate"]
        hint: "voi → частица **vi** + окончание -ate."
        ru: "Во сколько вы просыпаетесь?"
      - type: input
        level: 3
        q: "Le ragazze si sono ___ (vestire) in fretta."
        answer: ["vestite"]
        hint: "С essere согласуем: ж. р. мн. ч. → vest**ite**."
        ru: "Девушки быстро оделись."
      - type: choice
        level: 2
        q: "In questo negozio ___ vestiti usati."
        options: ["si vende", "si vendono", "vendono si", "ci vendono"]
        answer: 1
        hint: "Безличное si + существительное **во мн. ч.** (vestiti) → глагол во мн. ч."
        ru: "В этом магазине продаётся одежда секонд-хенд."
      - type: choice
        level: 1
        q: "In Italia ___ la pasta quasi ogni giorno."
        options: ["si mangia", "si mangiano", "mangia si", "ci mangia"]
        answer: 0
        hint: "«Здесь едят» — безличное **si** + глагол в 3-м лице; la pasta — ед. ч."
        ru: "В Италии пасту едят почти каждый день."
      - type: cloze
        level: 3
        q: "Возвратный или нет? Выберите частицу или «—», если она не нужна."
        text: "Prima [[*mi/si/—]] lavo, poi [[*—/mi/si]] lavo i piatti. Lorenzo [[*si/mi/—]] fa la barba ogni mattina."
        hint: "lavarsi — мыться (себя) → mi; lavare i piatti — мыть посуду (не себя) → частица не нужна; farsi la barba — бриться → si."
        ru: "Сначала я умываюсь, потом мою посуду. Лоренцо бреется каждое утро."
      - type: error
        level: 2
        q: "Найдите ошибку."
        text: "Stamattina mi {{ho=>sono}} svegliata tardi."
        hint: "Возвратные глаголы в passato prossimo — только с essere."
        ru: "Сегодня утром я проснулась поздно."
      - type: error
        level: 3
        q: "Найдите ошибку."
        text: "Devo {{alzarsi=>alzarmi}} presto domani."
        hint: "Частица в инфинитиве меняется по лицу: (io) devo alzar**mi**."
        ru: "Завтра мне нужно рано встать."
      - type: order
        level: 2
        q: "Соберите: «Мы познакомились в Риме.»"
        answer: "Ci siamo conosciuti a Roma."
        hint: "Взаимный глагол conoscersi: ci + siamo + conosciuti."
        ru: "Мы познакомились в Риме."
      - type: match
        level: 2
        q: "Соедините глагол и перевод"
        hint: "Все глаголы возвратные."
        pairs:
          - ["svegliarsi", "просыпаться"]
          - ["vestirsi", "одеваться"]
          - ["divertirsi", "веселиться"]
          - ["riposarsi", "отдыхать"]
          - ["sentirsi", "чувствовать себя"]
        ru: "Возвратные глаголы."

