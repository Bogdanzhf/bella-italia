lessons_before:
  - slug: dialogo-fare-spese
    kind: dialogue
    title_it: "I saldi!"
    title_ru: "Распродажа!"
    dialogue:
      title: "In un negozio di abbigliamento"
      scene: "Начались распродажи. София и Джанна идут по магазинам в центре Милана."
      lines:
        - "Gianna: Sofia, guarda questo vestito rosa! Ti piace? | София, смотри, какое розовое платье! Тебе нравится?"
        - "Sofia: È bellissimo! Lo posso provare? | Очень красивое! Можно его примерить?"
        - "Commessa: Certo! Che taglia porta? | Конечно! Какой у вас размер?"
        - "Sofia: La 42, credo. | 42-й, кажется."
        - "Commessa: Ecco a Lei. Il camerino è in fondo a destra. | Вот, пожалуйста. Примерочная в конце справа."
        - "Gianna: Allora? Come ti sta? | Ну что? Как сидит?"
        - "Sofia: Mi sta un po' stretto. Avete la 44? | Немного узковато. У вас есть 44-й?"
        - "Commessa: Sì, eccolo. E oggi c'è lo sconto del trenta per cento. | Да, вот. И сегодня скидка тридцать процентов."
        - "Sofia: Perfetto, lo prendo! Posso pagare con la carta? | Отлично, беру! Можно оплатить картой?"
        - "Commessa: Certo, si può pagare anche con il cellulare. | Конечно, можно оплатить и телефоном."
        - "Gianna: Brava! Adesso andiamo a cercare le scarpe! | Умница! А теперь пойдём искать туфли!"
        - "Sofia: Gianna, mi sono già stancata… Prima un caffè! | Джанна, я уже устала… Сначала кофе!"
    words:
      - "il per cento | процент"
      - "in fondo a destra | в конце справа"
      - "stancarsi | уставать"
    phrases:
      - "Lo posso provare? | Можно примерить?"
      - "Come ti sta? | Как сидит? Идёт тебе?"
      - "Mi sta un po' stretto. | Немного узковато."
      - "Lo prendo! | Беру!"
    exercises:
      - type: tf
        level: 1
        ref: dialogue
        q: "Верно или неверно?"
        items:
          - ["Il vestito è rosa.", true]
          - ["La taglia 42 va benissimo.", false]
          - ["C'è uno sconto del 30%.", true]
          - ["Sofia paga in contanti.", false]
      - type: choice
        level: 2
        audio: "Mi sta un po' stretto. Avete la quarantaquattro?"
        q: "🎧 Какой размер просит София?"
        options: ["40", "42", "44", "46"]
        answer: 2
      - type: cloze
        level: 2
        ref: dialogue
        q: "Заполните пропуски."
        text: "Lo posso [[provare]]? Che [[taglia]] porta? Il [[camerino]] è in fondo a destra."
      - type: dialog
        level: 2
        q: "Восстановите диалог в магазине."
        lines:
          - "Buongiorno, posso provare questa giacca?"
          - "Certo! Che taglia porta?"
          - "La 46."
          - "Ecco a Lei, il camerino è lì."

lessons_after:
  - slug: moda-milano
    kind: culture
    title_it: "Milano, capitale della moda"
    title_ru: "Милан — столица моды"
    reading:
      title: "Il Made in Italy"
      photo: p-galleria-milano
      text: |
        Milano è una delle capitali mondiali della moda. Due volte all'anno, a febbraio e a settembre, c'è la Settimana della moda: stilisti di tutto il mondo presentano le loro collezioni.
        Nel centro di Milano c'è la Galleria Vittorio Emanuele II, con negozi eleganti, bar storici e un bellissimo tetto di vetro.
        Il "Made in Italy" non è solo vestiti: anche scarpe, borse, occhiali e gioielli italiani sono famosi in tutto il mondo.
        Molti italiani amano vestirsi bene anche nella vita di tutti i giorni. In Italia si dice: "Non c'è una seconda occasione per fare una buona prima impressione".
        I saldi in Italia ci sono due volte all'anno: a gennaio e a luglio.
      ru: |
        Милан — одна из мировых столиц моды. Дважды в год, в феврале и сентябре, проходит Неделя моды: модельеры со всего мира показывают свои коллекции.
        В центре Милана находится Галерея Виктора Эммануила II с элегантными магазинами, историческими барами и красивой стеклянной крышей.
        «Сделано в Италии» — это не только одежда: итальянские туфли, сумки, очки и украшения тоже знамениты во всём мире.
        Многие итальянцы любят хорошо одеваться и в повседневной жизни. В Италии говорят: «Второго шанса произвести первое впечатление не бывает».
        Распродажи в Италии бывают дважды в год: в январе и в июле.
      glossary:
        - "la collezione | коллекция"
        - "il tetto di vetro | стеклянная крыша"
        - "la vita di tutti i giorni | повседневная жизнь"
        - "l'impressione | впечатление | f"
    photos: [p-duomo-milano]
    words:
      - "la Settimana della moda | Неделя моды"
      - "il tetto | крыша"
      - "il vetro | стекло"
      - "l'impressione | впечатление | f"
    exercises:
      - type: tf
        level: 1
        ref: reading
        q: "Верно или неверно?"
        items:
          - ["La Settimana della moda c'è una volta all'anno.", false]
          - ["La Galleria ha un tetto di vetro.", true]
          - ["I saldi ci sono a gennaio e a luglio.", true]
      - type: odd
        level: 2
        q: "Найдите лишнее: что не входит в «Made in Italy» из текста?"
        options: ["scarpe", "borse", "occhiali", "computer"]
        answer: 3
      - type: choice
        level: 2
        ref: reading
        q: "Когда в Италии распродажи?"
        options: ["в феврале и сентябре", "в январе и июле", "только в декабре", "каждый месяц"]
        answer: 1

