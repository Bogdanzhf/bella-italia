  - slug: dal-medico
    kind: lesson
    title_it: "Mi fa male la testa"
    title_ru: "У врача и в аптеке"
    theory: |
      ## Что болит?

      **Mi fa male** + ед. ч. / **Mi fanno male** + мн. ч. — «у меня болит / болят»:

      * *Mi fa male **la testa**.* — У меня болит голова. · *Mi fanno male **i piedi**.* — У меня болят ноги (ступни).
      * **avere mal di** + часть тела: *Ho mal di testa, mal di gola, mal di denti, mal di pancia.*

      ## Как я себя чувствую

      * *Mi sento male / bene / meglio.* — Мне плохо / хорошо / лучше.
      * *Ho la febbre, la tosse, il raffreddore.* — У меня температура, кашель, насморк.
      * *Mi sono fatta male al braccio.* — Я ушибла руку. (возвратный глагол в прошедшем — с essere)

      ## Части тела: особое множественное число

      *il braccio → **le braccia**, il dito → **le dita**, il ginocchio → **le ginocchia**, l'orecchio → le orecchie, la mano → **le mani**.*

      > 💡 У врача: *Da quanto tempo?* — С какого времени? *Prenda questa medicina tre volte al giorno.* — Принимайте это лекарство три раза в день.
    dialogue:
      title: "Dal medico"
      scene: "София простудилась и пришла к врачу."
      lines:
        - "Medico: Buongiorno, signorina. Come si sente? | Добрый день, синьорина. Как Вы себя чувствуете?"
        - "Sofia: Non molto bene. Ho mal di gola e mi fa male la testa. | Не очень хорошо. У меня болит горло и голова."
        - "Medico: Da quanto tempo? Ha anche la febbre? | Давно? Температура тоже есть?"
        - "Sofia: Da due giorni. Ieri sera avevo trentotto. | Два дня. Вчера вечером было тридцать восемь."
        - "Medico: Vediamo… Apra la bocca, per favore. Sì, la gola è rossa. È un'influenza. | Посмотрим… Откройте рот, пожалуйста. Да, горло красное. Это грипп."
        - "Sofia: È grave? Domani devo lavorare. | Это серьёзно? Завтра мне надо работать."
        - "Medico: No, ma deve riposarsi per tre o quattro giorni. Le scrivo la ricetta. | Нет, но Вам нужно отдохнуть три-четыре дня. Я выпишу Вам рецепт."
        - "Sofia: Grazie, dottore. Quante volte al giorno devo prendere la medicina? | Спасибо, доктор. Сколько раз в день принимать лекарство?"
        - "Medico: Due volte al giorno, dopo i pasti. E beva molta acqua! | Два раза в день, после еды. И пейте много воды!"
    words:
