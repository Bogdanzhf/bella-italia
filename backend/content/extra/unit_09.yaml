        - "Gianna: E l'affitto? | А аренда?"
        - "Sofia: È meno caro di quello che pensavo: ottocento euro. L'altro costa mille. | Дешевле, чем я думала: восемьсот евро. Вторая стоит тысячу."
        - "Gianna: Allora il primo è più conveniente! E la zona? | Тогда первая выгоднее! А район?"
