lessons_before:
  - slug: dialogo-cena-fuori
    kind: dialogue
    title_it: "Il compleanno di Gianna"
    title_ru: "День рождения Джанны"
    dialogue:
      title: "Al ristorante"
      scene: "Друзья празднуют день рождения Джанны в траттории. Подходит официант."
      lines:
        - "Cameriere: Buonasera! Siete pronti per ordinare? | Добрый вечер! Готовы сделать заказ?"
        - "Gianna: Sì. Come primo vorrei le tagliatelle ai funghi. | Да. На первое я бы хотела тальятелле с грибами."
        - "Sofia: Per me il risotto alla milanese. È la vostra specialità, vero? | Мне ризотто по-милански. Это ваше фирменное блюдо, правда?"
        - "Cameriere: Esatto, signorina. E come secondo? | Именно, синьорина. А на второе?"
        - "Lorenzo: Io prendo la bistecca ai ferri, ben cotta, per favore. | Я возьму бифштекс на гриле, хорошо прожаренный, пожалуйста."
        - "Cameriere: E da bere? | А что будете пить?"
        - "Gianna: Una bottiglia di acqua frizzante e del vino rosso. | Бутылку газированной воды и красного вина."
        - "Sofia: Gianna, questa è per te. Tanti auguri! | Джанна, это тебе. С днём рождения!"
        - "Gianna: Oh, grazie! Che bella sciarpa! Ma non dovevi! | Ой, спасибо! Какой красивый шарф! Ну зачем ты!"
        - "Lorenzo: E alla fine prendiamo il tiramisù con le candeline! | А в конце возьмём тирамису со свечками!"
        - "Gianna: Ragazzi, siete i migliori amici del mondo! | Ребята, вы лучшие друзья на свете!"
    words:
      - "la specialità | фирменное блюдо"
      - "la candelina | свечка (на торте)"
      - "non dovevi | не стоило, ну зачем ты"
    phrases:
      - "Siete pronti per ordinare? | Готовы сделать заказ?"
      - "Come primo vorrei… | На первое я бы хотела…"
      - "E da bere? | А что будете пить?"
      - "Tanti auguri! | С днём рождения! Всего наилучшего!"
    exercises:
      - type: tf
        level: 1
        ref: dialogue
        q: "Верно или неверно?"
        items:
          - ["Sofia prende il risotto alla milanese.", true]
          - ["Lorenzo vuole la bistecca poco cotta.", false]
          - ["Sofia regala una sciarpa a Gianna.", true]
          - ["Alla fine prendono la panna cotta.", false]
      - type: choice
        level: 2
        audio: "Come secondo prendo la bistecca ai ferri, ben cotta."
        q: "🎧 Что человек заказывает на второе?"
        options: ["курицу", "бифштекс на гриле", "рыбу", "отбивную"]
        answer: 1
      - type: dialog
        level: 2
        q: "Восстановите заказ в ресторане."
        lines:
          - "Buonasera, siete pronti per ordinare?"
          - "Sì, per me gli spaghetti alla carbonara."
          - "E da bere?"
          - "Un'acqua minerale, grazie."
      - type: cloze
        level: 3
        ref: dialogue
        q: "Заполните пропуски."
        text: "Come [[primo]] Gianna prende le tagliatelle. Lorenzo vuole la bistecca ben [[cotta]]. Sofia dice: «Tanti [[auguri]]!»"

lessons_after:
  - slug: cucina-italiana
    kind: culture
    title_it: "La cucina italiana: un po' di storia"
    title_ru: "Итальянская кухня: немного истории"
    reading:
      title: "La pizza Margherita"
      photo: p-pizza-margherita
      text: |
        La cucina italiana è famosa in tutto il mondo, ma ogni regione ha i suoi piatti tipici.
        La pizza nasce a Napoli. Nel 1889 il pizzaiolo Raffaele Esposito prepara una pizza per la regina Margherita: pomodoro rosso, mozzarella bianca e basilico verde, i colori della bandiera italiana. Da allora questa pizza si chiama "Margherita".
        Anche la pasta è antichissima. Esistono centinaia di tipi di pasta: spaghetti, penne, fusilli, farfalle, tagliatelle…
        Gli italiani mangiano la pasta "al dente", cioè non troppo cotta.
        Dove mangiano gli italiani? Al ristorante, in trattoria, in pizzeria. Per un pranzo veloce vanno al bar o in paninoteca.
      ru: |
        Итальянская кухня известна во всём мире, но у каждого региона свои типичные блюда.
        Пицца родилась в Неаполе. В 1889 году пиццайоло Раффаэле Эспозито приготовил пиццу для королевы Маргариты: красные помидоры, белая моцарелла и зелёный базилик — цвета итальянского флага. С тех пор эта пицца называется «Маргарита».
        Паста тоже очень древняя. Существуют сотни видов пасты: спагетти, пенне, фузилли, фарфалле, тальятелле…
        Итальянцы едят пасту «аль денте», то есть не переваренную.
        Где едят итальянцы? В ресторане, траттории, пиццерии. Для быстрого обеда — в баре или панинотеке.
      glossary:
        - "il pizzaiolo | пиццайоло (пекарь пиццы)"
        - "da allora | с тех пор"
        - "centinaia | сотни"
        - "cioè | то есть"
    photos: [p-pasta-tipi, p-gelateria]
    words:
      - "il pizzaiolo | пиццайоло"
      - "la paninoteca | закусочная с бутербродами"
      - "da allora | с тех пор"
      - "cioè | то есть"
    exercises:
      - type: tf
        level: 1
        ref: reading
        q: "Верно или неверно?"
        items:
          - ["La pizza nasce a Milano.", false]
          - ["La pizza Margherita ha i colori della bandiera italiana.", true]
          - ["Gli italiani mangiano la pasta molto cotta.", false]
      - type: match
        level: 1
        q: "Соедините ингредиент и цвет флага"
        pairs:
          - ["il pomodoro", "rosso"]
          - ["la mozzarella", "bianco"]
          - ["il basilico", "verde"]
      - type: choice
        level: 1
        img: p-pizza-margherita
        q: "Что на фото?"
        options: ["la pizza Margherita", "il risotto", "la lasagna", "il tiramisù"]
        answer: 0
      - type: odd
        level: 2
        q: "Найдите лишнее: что не вид пасты?"
        options: ["penne", "fusilli", "farfalle", "cotoletta"]
        answer: 3

  - slug: praktikum-6
    kind: practice
    title_it: "Esercizi: possessivi, quello e bello"
    title_ru: "Практикум: притяжательные, quello и bello, volerci / metterci"
    theory: |
      ## Памятка

      | | м. ед. | ж. ед. | м. мн. | ж. мн. |
      |---|---|---|---|---|
      | мой | il mio | la mia | i miei | le mie |
      | твой | il tuo | la tua | i tuoi | le tue |
      | его / её / Ваш | il suo | la sua | i suoi | le sue |
      | наш | il nostro | la nostra | i nostri | le nostre |
      | ваш | il vostro | la vostra | i vostri | le vostre |
      | их | il loro | la loro | i loro | le loro |

      * **suo / sua** согласуется с **предметом**, а не с владельцем: *Marco e **la sua** macchina* (его машина), *Anna e **il suo** libro* (её книга).
      * С **одним** родственником в ед. ч. артикль не ставят: *mio padre, sua sorella*. Но: *i miei fratelli, la loro madre, la mia mamma, il mio fratellino*.

      **quello** и **bello** перед существительным ведут себя как определённый артикль:

      | артикль | il | lo | l' | la | i | gli | le |
      |---|---|---|---|---|---|---|---|
      | quello | quel | quello | quell' | quella | quei | quegli | quelle |
      | bello | bel | bello | bell' | bella | bei | begli | belle |

      **volerci** (требуется — безлично): *Ci **vuole** un'ora. Ci **vogliono** due ore.*
      **metterci** (тратит человек): *Io **ci metto** venti minuti.*
    exercises:
      - type: choice
        level: 1
        q: "Anna è con ___ fratello."
        options: ["suo", "il suo", "sua", "la sua"]
        answer: 0
        hint: "Один родственник (fratello, ед. ч.) → без артикля; fratello — м. р. → **suo**."
        ru: "Анна со своим братом."
      - type: choice
        level: 2
        q: "Marco parla con ___ madre."
        options: ["suo", "sua", "la sua", "il suo"]
        answer: 1
        hint: "suo / sua согласуется с **предметом** (madre — ж. р.), а не с Марко; родственник в ед. ч. → без артикля."
        ru: "Марко разговаривает со своей мамой."
      - type: choice
        level: 2
        q: "Questi sono ___ nonni."
        options: ["miei", "i miei", "mie", "le mie"]
        answer: 1
        hint: "Родственники во **мн. ч.** → с артиклем: i miei."
        ru: "Это мои бабушка и дедушка."
      - type: choice
        level: 2
        q: "Gianna e Lorenzo? ___ figlia si chiama Ada."
        options: ["Sua", "La loro", "Loro", "La sua"]
        answer: 1
        hint: "«их» — **loro**, всегда с артиклем: la loro figlia."
        ru: "Джанна и Лоренцо? Их дочь зовут Ада."
      - type: input
        level: 2
        q: "Ho dimenticato ___ chiavi a casa. (мои)"
        answer: ["le mie"]
        hint: "chiavi — ж. р. мн. ч. → **le mie**."
        ru: "Я забыла свои ключи дома."
      - type: choice
        level: 1
        q: "Guarda ___ ragazzo!"
        options: ["quel", "quello", "quell'", "quella"]
        answer: 0
        hint: "Перед ragazzo артикль **il** → **quel**."
        ru: "Посмотри на того парня!"
      - type: choice
        level: 2
        q: "Mi piacciono ___ stivali."
        options: ["quei", "quelli", "quegli", "quelle"]
        answer: 2
        hint: "stivali начинается на s + согласная → артикль **gli** → **quegli**."
        ru: "Мне нравятся те сапоги."
      - type: choice
        level: 2
        q: "Che ___ idea!"
        options: ["bel", "bello", "bell'", "bella"]
        answer: 2
        hint: "idea — ж. р., начинается с гласной → **l'** → **bell'**."
        ru: "Какая прекрасная идея!"
      - type: cloze
        level: 3
        q: "Поставьте нужную форму quello."
        text: "[[quel]] libro, [[quello]] specchio, [[quell']]albero, [[quei]] piatti, [[quegli]] amici, [[quelle]] case"
        hint: "Подставьте артикль: il libro, lo specchio, l'albero, i piatti, gli amici, le case — и замените его формой quello."
        ru: "та книга, то зеркало, то дерево, те тарелки, те друзья, те дома"
      - type: choice
        level: 2
        q: "Per arrivare a Firenze ___ tre ore."
        options: ["ci vuole", "ci vogliono", "ci metto", "ci mettono"]
        answer: 1
        hint: "Безличное «нужно (времени)» → **volerci**; tre ore — мн. ч. → ci vogliono."
        ru: "Чтобы добраться до Флоренции, нужно три часа."
      - type: choice
        level: 2
        q: "Quanto tempo ___ tu per fare la doccia?"
        options: ["ci vuole", "ci metti", "ci vogliono", "ci mette"]
        answer: 1
        hint: "Время тратит конкретный человек (tu) → **metterci**: tu ci metti."
        ru: "Сколько времени у тебя уходит на душ?"
      - type: error
        level: 2
        q: "Найдите ошибку."
        text: "I {{mio=>miei}} genitori abitano a Bari."
        hint: "genitori — м. р. мн. ч. → притяжательное тоже во мн. ч.: i miei."
        ru: "Мои родители живут в Бари."
      - type: error
        level: 3
        q: "Найдите ошибку."
        text: "Che {{bello=>bel}} vestito!"
        hint: "Перед vestito (артикль il) bello принимает форму **bel**."
        ru: "Какое красивое платье!"
      - type: match
        level: 2
        q: "Соедините существительное и форму bello"
        hint: "Как артикль: il → bel, lo → bello, l' → bell', i → bei, gli → begli."
        pairs:
          - ["giardino", "bel"]
          - ["zaino", "bello"]
          - ["albergo", "bell'"]
          - ["fiori", "bei"]
          - ["occhi", "begli"]
        ru: "сад, рюкзак, гостиница, цветы, глаза — с формой «красивый»"

  - slug: autovalutazione-6
    kind: review
    title_it: "Che cosa hai imparato?"
    title_ru: "Самопроверка: юнит 6"
    theory: |
      ## Что вы уже умеете

      * употреблять все притяжательные (**nostro, vostro, loro**), в том числе с родственниками: *mia madre*, но *le mie sorelle*;
      * заказывать в ресторане (**vorrei**, *come primo / secondo*);
      * говорить, что нравится: **mi piace / mi piacciono**;
      * говорить, сколько нужно времени: **ci vuole / ci vogliono, ci metto**;
      * ставить **quello** и **bello** перед существительным.
    exercises:
      - type: match
        level: 1
        q: "Соедините часть меню и блюдо"
        pairs:
          - ["antipasto", "bruschette"]
          - ["primo", "spaghetti alla carbonara"]
          - ["secondo", "pollo all'aglio"]
          - ["contorno", "patate al forno"]
          - ["dolce", "panna cotta"]
      - type: odd
        level: 1
        q: "Найдите лишнее: что не посуда?"
        options: ["forchetta", "cucchiaio", "coltello", "cugino"]
        answer: 3
      - type: error
        level: 2
        q: "Найдите ошибку."
        text: "Mia {{madri=>madre}} è italiana e mio padre è russo."
      - type: error
        level: 2
        q: "Найдите ошибку."
        text: "Mi {{piace=>piacciono}} i dolci."
      - type: error
        level: 3
        q: "Найдите ошибку."
        text: "Per arrivare in centro ci {{vuole=>vogliono}} venti minuti."
      - type: cloze
        level: 3
        q: "Заполните пропуски."
        text: "Che [[bel]] ristorante! [[Quei]] ragazzi sono i [[loro]] figli."
      - type: choice
        level: 2
        audio: "Il conto, per favore."
        q: "🎧 Что просит человек?"
        options: ["меню", "счёт", "воду", "соль"]
        answer: 1

