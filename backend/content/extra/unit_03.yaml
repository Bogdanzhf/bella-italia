lessons_before:
  - slug: dialogo-in-contatto
    kind: dialogue
    title_it: "Un pacco per la nonna"
    title_ru: "Посылка для бабушки"
    dialogue:
      title: "Dov'è l'ufficio postale?"
      scene: "София хочет отправить посылку бабушке в Москву. Она пишет Микеле, коллеге Джанны."
      lines:
        - "Sofia: Ciao Michela! Sai dov'è l'ufficio postale? | Привет, Микела! Ты знаешь, где почта?"
        - "Michela: Sì, è in piazza, davanti alla banca. Che cosa devi spedire? | Да, на площади, напротив банка. Что тебе нужно отправить?"
        - "Sofia: Un pacco per mia nonna. A che ora apre? | Посылку для моей бабушки. Во сколько открывается?"
        - "Michela: Apre alle otto e mezza e chiude all'una e mezza. | Открывается в полвосьмого и закрывается в полвторого."
        - "Sofia: E il pomeriggio? | А днём?"
        - "Michela: Il pomeriggio è chiuso. Il sabato è aperto solo la mattina. | Днём закрыто. В субботу открыто только утром."
        - "Sofia: Allora vado subito! C'è anche un bar vicino? | Тогда иду сразу! А рядом есть бар?"
        - "Michela: Sì, c'è il bar Eden, accanto alla farmacia. Fanno dei cornetti buonissimi! | Да, бар «Эден», рядом с аптекой. Там очень вкусные круассаны!"
        - "Sofia: Grazie mille, Michela! | Огромное спасибо, Микела!"
        - "Michela: Figurati! A presto! | Не за что! До скорого!"
    words:
      - "spedire | отправлять"
      - "accanto a | рядом с"
      - "solo | только"
    phrases:
      - "Sai dov'è l'ufficio postale? | Ты знаешь, где почта?"
      - "A che ora apre? | Во сколько открывается?"
      - "Grazie mille! — Figurati! | Огромное спасибо! — Не за что!"
    exercises:
      - type: tf
        level: 1
        ref: dialogue
        q: "Верно или неверно?"
        items:
          - ["L'ufficio postale è davanti alla banca.", true]
          - ["Il pomeriggio l'ufficio postale è aperto.", false]
          - ["Il bar Eden è accanto alla farmacia.", true]
          - ["Sofia spedisce un pacco a sua madre.", false]
      - type: choice
        level: 2
        audio: "Apre alle otto e mezza e chiude all'una e mezza."
        q: "🎧 Во сколько закрывается почта?"
        options: ["12:30", "13:30", "8:30", "1:00"]
        answer: 1
      - type: cloze
        level: 2
        ref: dialogue
        q: "Заполните пропуски сочленёнными предлогами."
        text: "L'ufficio postale è davanti [[alla]] banca. Il bar è accanto [[alla]] farmacia. Apre [[alle]] otto e mezza."
      - type: dialog
        level: 2
        q: "Восстановите диалог."
        lines:
          - "Scusi, a che ora chiude la banca?"
          - "Alle quattro."
          - "E il sabato è aperta?"
          - "No, il sabato è chiusa."

lessons_after:
  - slug: piazze-italiane
    kind: culture
    title_it: "Piazze, fontane e numeri utili"
    title_ru: "Площади, фонтаны и полезные номера"
    reading:
      title: "La piazza: il cuore della città"
      photo: p-fontana-trevi
      text: |
        In Italia ogni città ha la sua piazza. In piazza ci sono spesso una chiesa, un bar, dei negozi e una fontana.
        Le persone si incontrano in piazza, parlano, prendono un caffè o un aperitivo.
        A Roma c'è la Fontana di Trevi. La tradizione dice: se lanci una moneta nella fontana, tornerai a Roma!
        A Venezia c'è Piazza San Marco, con la basilica e il campanile.
        In Italia il numero per le emergenze è il 112. Per chiamare l'Italia dall'estero il prefisso è +39.
      ru: |
        В Италии у каждого города есть своя площадь. На площади часто есть церковь, бар, магазины и фонтан.
        Люди встречаются на площади, разговаривают, пьют кофе или аперитив.
        В Риме есть фонтан Треви. Традиция гласит: если бросишь монетку в фонтан, вернёшься в Рим!
        В Венеции есть площадь Сан-Марко с базиликой и колокольней.
        В Италии номер экстренных служб — 112. Чтобы позвонить в Италию из-за границы, код +39.
      glossary:
        - "il cuore | сердце"
        - "incontrarsi | встречаться"
        - "lanciare | бросать"
        - "la moneta | монета"
        - "il campanile | колокольня"
    photos: [p-san-marco, p-galleria-milano]
    words:
      - "il cuore | сердце"
      - "la moneta | монета"
      - "il campanile | колокольня"
      - "l'emergenza | экстренный случай | f"
    exercises:
      - type: tf
        level: 1
        ref: reading
        q: "Верно или неверно?"
        items:
          - ["La Fontana di Trevi è a Venezia.", false]
          - ["In piazza le persone prendono un caffè.", true]
          - ["Il numero per le emergenze è il 112.", true]
      - type: choice
        level: 1
        img: p-san-marco
        q: "Что на фото?"
        options: ["Piazza San Marco", "il Colosseo", "la Torre di Pisa", "il Duomo di Milano"]
        answer: 0
      - type: choice
        level: 2
        audio: "Per chiamare l'Italia il prefisso è più trentanove."
        q: "🎧 Какой телефонный код Италии?"
        options: ["+7", "+39", "+33", "+49"]
        answer: 1

  - slug: praktikum-3
    kind: practice
    title_it: "Esercizi: preposizioni articolate e possessivi"
    title_ru: "Практикум: сочленённые предлоги, c'è / ci sono, притяжательные"
    theory: |
      ## Памятка

      **Сочленённые предлоги:** предлог + определённый артикль = одно слово.

      | | il | lo | l' | la | i | gli | le |
      |---|---|---|---|---|---|---|---|
      | **a** | al | allo | all' | alla | ai | agli | alle |
      | **di** | del | dello | dell' | della | dei | degli | delle |
      | **da** | dal | dallo | dall' | dalla | dai | dagli | dalle |
      | **in** | nel | nello | nell' | nella | nei | negli | nelle |
      | **su** | sul | sullo | sull' | sulla | sui | sugli | sulle |

      **con, per, tra / fra** с артиклем не сливаются: *con il treno, per la mamma*.

      **C'è / ci sono:** *C'è un tavolo* (ед. ч.) · *Ci sono due sedie* (мн. ч.).

      **Притяжательные** стоят с артиклем: *il mio libro, la tua casa, i suoi amici*.
      **Без артикля** — с одним родственником в ед. ч.: *mia madre, tuo fratello* (но *la mia mamma, i miei genitori, il loro padre*).

      **Частичный артикль** (немного, какие-то) = di + артикль: *Vorrei **del** pane, **dell'**acqua, **delle** mele.*
    exercises:
      - type: choice
        level: 1
        q: "Il libro è ___ tavolo."
        options: ["sul", "sullo", "su il", "nel"]
        answer: 0
        hint: "su + il = **sul** (на столе)."
        ru: "Книга на столе."
      - type: choice
        level: 1
        q: "Vado ___ stazione."
        options: ["al", "alla", "allo", "a la"]
        answer: 1
        hint: "stazione — ж. р. → a + la = **alla**."
        ru: "Я иду на вокзал."
      - type: choice
        level: 2
        q: "Le chiavi sono ___ zaino."
        options: ["nel", "nello", "nell'", "in lo"]
        answer: 1
        hint: "zaino начинается на z → артикль lo → in + lo = **nello**."
        ru: "Ключи в рюкзаке."
      - type: choice
        level: 2
        q: "Il treno arriva ___ aeroporto."
        options: ["dal", "dall'", "dallo", "dalla"]
        answer: 1
        hint: "aeroporto начинается с гласной → l' → da + l' = **dall'**."
        ru: "Поезд прибывает из аэропорта."
      - type: cloze
        level: 2
        q: "Соедините предлог с артиклем."
        text: "la casa [[della]] nonna (di + la), il libro [[dello]] studente (di + lo), [[negli]] Stati Uniti (in + gli), [[ai]] bambini (a + i)"
        hint: "Смотрите на артикль существительного и сливайте по таблице: di + la = della, di + lo = dello, in + gli = negli, a + i = ai."
        ru: "дом бабушки, книга студента, в Соединённых Штатах, детям"
      - type: choice
        level: 1
        q: "Nella stanza ___ due finestre."
        options: ["c'è", "ci sono", "è", "ha"]
        answer: 1
        hint: "«Есть / находятся» для **мн. ч.** (due finestre) → **ci sono**."
        ru: "В комнате два окна."
      - type: choice
        level: 1
        q: "In piazza ___ una fontana."
        options: ["c'è", "ci sono", "sono", "ha"]
        answer: 0
        hint: "Один предмет (ед. ч.) → **c'è**."
        ru: "На площади есть фонтан."
      - type: choice
        level: 2
        q: "___ madre è insegnante."
        options: ["Mia", "La mia", "Il mio", "Mie"]
        answer: 0
        hint: "Один родственник в ед. ч. → **без артикля**: mia madre."
        ru: "Моя мама — учительница."
      - type: choice
        level: 2
        q: "___ genitori abitano a Torino."
        options: ["Miei", "I miei", "Mie", "Il mio"]
        answer: 1
        hint: "Родственники во **мн. ч.** → артикль нужен: **i miei** genitori."
        ru: "Мои родители живут в Турине."
      - type: choice
        level: 3
        q: "Marco e Luca? ___ padre è medico."
        options: ["Suo", "Il loro", "Loro", "I loro"]
        answer: 1
        hint: "**loro** (их) всегда с артиклем, даже с родственником: **il loro** padre."
        ru: "Марко и Лука? Их отец — врач."
      - type: input
        level: 2
        q: "Vorrei ___ pane, per favore. (немного хлеба: di + il)"
        answer: ["del"]
        hint: "Частичный артикль = di + артикль: di + il = **del**."
        ru: "Я бы хотела хлеба, пожалуйста."
      - type: input
        level: 3
        q: "Compro ___ uova al mercato. (какие-то яйца: di + le)"
        answer: ["delle"]
        hint: "le uova (ж. р. мн. ч.!) → di + le = **delle**."
        ru: "Я покупаю яйца на рынке."
      - type: error
        level: 2
        q: "Найдите ошибку."
        text: "Mio fratello vive {{in=>a}} Napoli."
        hint: "Перед **городом** — предлог a (in — перед страной: in Italia)."
        ru: "Мой брат живёт в Неаполе."
      - type: error
        level: 2
        q: "Найдите ошибку."
        text: "Le foto sono {{su=>sul}} computer."
        hint: "Перед существительным с артиклем il предлог su сливается: **sul**."
        ru: "Фотографии на компьютере."
      - type: match
        level: 2
        q: "Соедините предлог + артикль и результат"
        hint: "Таблица сочленённых предлогов в памятке."
        pairs:
          - ["a + il", "al"]
          - ["di + gli", "degli"]
          - ["da + la", "dalla"]
          - ["in + i", "nei"]
          - ["su + le", "sulle"]
        ru: "Сочленённые предлоги."

  - slug: autovalutazione-3
    kind: review
    title_it: "Che cosa hai imparato?"
    title_ru: "Самопроверка: юнит 3"
    theory: |
      ## Что вы уже умеете

      * сливать предлоги с артиклями: **al, dello, nella, sui…**;
      * спрашивать часы работы, описывать комнату с **c'è / ci sono**;
      * выражать принадлежность: **il mio, la tua, i suoi**;
      * благодарить и отвечать; называть месяцы и времена года;
      * писать короткие письма и сообщения.
    exercises:
      - type: match
        level: 1
        q: "Соедините"
        pairs:
          - ["Grazie mille!", "Di niente!"]
          - ["Di chi è?", "È mio."]
          - ["A che ora apre?", "Alle nove."]
          - ["Dov'è la lampada?", "Sul tavolo."]
      - type: odd
        level: 1
        q: "Найдите лишнее: что не месяц?"
        options: ["marzo", "estate", "luglio", "ottobre"]
        answer: 1
      - type: odd
        level: 2
        q: "Найдите лишнее: что не мебель?"
        options: ["divano", "armadio", "poltrona", "finestra"]
        answer: 3
      - type: error
        level: 2
        q: "Найдите ошибку."
        text: "Il libro è {{su=>sul}} tavolo."
      - type: error
        level: 2
        q: "Найдите ошибку."
        text: "Nella stanza {{c'è=>ci sono}} due poltrone."
      - type: error
        level: 3
        q: "Найдите ошибку."
        text: "Maria e {{la=>il}} suo fratello sono a Roma."
      - type: cloze
        level: 3
        q: "Заполните пропуски."
        text: "Vado [[al]] cinema. Le chiavi sono [[nella]] borsa. Vuoi [[*dello/del/della]] zucchero?"
      - type: choice
        level: 2
        audio: "In primavera andiamo in campagna."
        q: "🎧 Когда они едут за город?"
        options: ["зимой", "весной", "летом", "осенью"]
        answer: 1

