lessons_before:
  - slug: dialogo-nuovo-inizio
    kind: dialogue
    title_it: "Un caffè con Gianna"
    title_ru: "Кофе с Джанной"
    dialogue:
      title: "Al bar vicino alla scuola"
      scene: "После урока Лоренцо знакомит Софию со своей подругой Джанной — журналисткой из Милана."
      lines:
        - "Lorenzo: Gianna, ti presento Sofia. È russa e studia l'italiano con me. | Джанна, познакомься, это София. Она русская и учит итальянский со мной."
        - "Gianna: Ciao, Sofia! Piacere. Io sono Gianna. | Привет, София! Приятно познакомиться. Я Джанна."
        - "Sofia: Piacere! Anche tu studi qui? | Очень приятно! Ты тоже здесь учишься?"
        - "Gianna: No, io lavoro. Sono giornalista, lavoro in un giornale in centro. | Нет, я работаю. Я журналистка, работаю в газете в центре."
        - "Sofia: Che bello! E abiti a Milano? | Как здорово! А ты живёшь в Милане?"
        - "Gianna: Sì, abito qui vicino. E tu dove abiti? | Да, живу здесь рядом. А ты где живёшь?"
        - "Sofia: Abito in via Dante, con una ragazza francese. | Я живу на улице Данте, с одной девушкой-француженкой."
        - "Gianna: Com'è? Simpatica? | Какая она? Приятная?"
        - "Sofia: Sì, è molto simpatica. È alta, bionda e ha gli occhi azzurri. | Да, очень приятная. Высокая, светлая, с голубыми глазами."
        - "Lorenzo: Ragazze, prendete un caffè? Offro io! | Девушки, будете кофе? Я угощаю!"
        - "Gianna: Grazie, Lorenzo! Per me un cappuccino. | Спасибо, Лоренцо! Мне капучино."
        - "Sofia: Anche per me, grazie. | Мне тоже, спасибо."
    words:
      - "presentare | представлять, знакомить"
      - "ti presento | познакомься, это…"
      - "anche | тоже, также"
      - "offro io | я угощаю"
    phrases:
      - "Ti presento Sofia. | Познакомься, это София."
      - "Anche tu studi qui? | Ты тоже здесь учишься?"
      - "Offro io! | Я угощаю!"
      - "Anche per me, grazie. | Мне тоже, спасибо."
    exercises:
      - type: tf
        level: 1
        ref: dialogue
        q: "Верно или неверно?"
        items:
          - ["Gianna è una studentessa.", false]
          - ["Gianna lavora in centro.", true]
          - ["Sofia abita con una ragazza francese.", true]
          - ["Lorenzo offre il caffè.", true]
      - type: choice
        level: 1
        ref: dialogue
        q: "Какая соседка Софии?"
        options: ["bassa e bruna", "alta e bionda", "anziana e simpatica", "alta e bruna"]
        answer: 1
      - type: choice
        level: 2
        audio: "Io lavoro. Sono giornalista."
        q: "🎧 Кем работает Джанна?"
        options: ["преподавательница", "журналистка", "официантка", "врач"]
        answer: 1
      - type: dialog
        level: 2
        q: "Восстановите порядок реплик."
        lines:
          - "Ti presento Gianna."
          - "Piacere, io sono Sofia."
          - "Piacere! Studi qui?"
          - "Sì, studio l'italiano."
      - type: cloze
        level: 3
        ref: dialogue
        q: "Заполните пропуски глаголами в нужной форме."
        text: "Gianna [[lavora]] in un giornale. Sofia [[abita]] in via Dante. Lorenzo e Sofia [[studiano]] l'italiano."

lessons_after:
  - slug: citta-italiane
    kind: culture
    title_it: "Le città italiane"
    title_ru: "Города Италии"
    reading:
      title: "Cinque città da visitare"
      photo: p-venezia
      text: |
        Roma è la capitale d'Italia ed è nel Lazio. È una città antica: qui ci sono il Colosseo e la Fontana di Trevi.
        Milano è nel Nord, in Lombardia. È la città della moda e del lavoro. Il Duomo di Milano è molto famoso.
        Venezia è nel Veneto. Non ci sono macchine: le persone prendono il vaporetto o la gondola.
        Firenze è in Toscana. È la città dell'arte: ci sono molti musei e il famoso Duomo.
        Napoli è nel Sud, in Campania. È la città della pizza e del mare. Vicino a Napoli c'è il Vesuvio.
      ru: |
        Рим — столица Италии, он находится в Лацио. Это древний город: здесь Колизей и фонтан Треви.
        Милан — на севере, в Ломбардии. Это город моды и работы. Миланский собор очень знаменит.
        Венеция — в регионе Венето. Там нет машин: люди ездят на речном трамвае или гондоле.
        Флоренция — в Тоскане. Это город искусства: там много музеев и знаменитый собор.
        Неаполь — на юге, в Кампании. Это город пиццы и моря. Рядом с Неаполем — Везувий.
      glossary:
        - "antico | древний"
        - "il Nord | север"
        - "il Sud | юг"
        - "le persone | люди"
        - "vicino a | рядом с"
    photos: [p-duomo-milano, p-firenze, p-napoli, p-fontana-trevi]
    words:
      - "antico | древний"
      - "il Nord | север"
      - "il Sud | юг"
      - "il Centro | центр (Италии)"
    exercises:
      - type: match
        level: 1
        ref: reading
        q: "Соедините город и регион"
        pairs:
          - ["Roma", "Lazio"]
          - ["Milano", "Lombardia"]
          - ["Firenze", "Toscana"]
          - ["Napoli", "Campania"]
          - ["Venezia", "Veneto"]
      - type: tf
        level: 1
        ref: reading
        q: "Верно или неверно?"
        items:
          - ["A Venezia ci sono molte macchine.", false]
          - ["Milano è la città della moda.", true]
          - ["Napoli è nel Nord.", false]
          - ["Il Vesuvio è vicino a Napoli.", true]
      - type: choice
        level: 1
        img: p-duomo-milano
        q: "Какой город на фото?"
        options: ["Milano", "Napoli", "Venezia", "Roma"]
        answer: 0
      - type: odd
        level: 2
        q: "Найдите лишнее: какой город НЕ на севере?"
        options: ["Milano", "Torino", "Venezia", "Napoli"]
        answer: 3

  - slug: praktikum-1
    kind: practice
    title_it: "Esercizi: presente, essere e avere"
    title_ru: "Практикум: настоящее время, essere и avere"
    theory: |
      ## Памятка

      **Правильные глаголы** — отбросьте -are / -ere / -ire и добавьте окончание:

      | | parl**are** | prend**ere** | dorm**ire** | fin**ire** (-isc-) |
      |---|---|---|---|---|
      | io | parl**o** | prend**o** | dorm**o** | fin**isco** |
      | tu | parl**i** | prend**i** | dorm**i** | fin**isci** |
      | lui / lei / Lei | parl**a** | prend**e** | dorm**e** | fin**isce** |
      | noi | parl**iamo** | prend**iamo** | dorm**iamo** | fin**iamo** |
      | voi | parl**ate** | prend**ete** | dorm**ite** | fin**ite** |
      | loro | parl**ano** | prend**ono** | dorm**ono** | fin**iscono** |

      **essere:** sono, sei, è, siamo, siete, sono · **avere:** ho, hai, ha, abbiamo, avete, hanno

      **Неопределённый артикль:** **un** (м. р.), **uno** (м. р. перед s + согл., z, gn, ps), **una** (ж. р.), **un'** (ж. р. перед гласной).

      **Вежливая форма Lei** = глагол в 3-м лице ед. ч.: *Lei è italiana?* — Вы итальянка?

      > 💡 Подлежащее (io, tu…) обычно опускают — лицо видно по окончанию: *Parlo italiano.*
    exercises:
      - type: choice
        level: 1
        q: "Tu ___ (parlare) italiano molto bene!"
        options: ["parlo", "parli", "parla", "parlate"]
        answer: 1
        hint: "Лицо **tu** во всех спряжениях оканчивается на **-i**."
        ru: "Ты очень хорошо говоришь по-итальянски!"
      - type: choice
        level: 1
        q: "Noi ___ (abitare) a Roma."
        options: ["abitiamo", "abitamo", "abitate", "abitano"]
        answer: 0
        hint: "Лицо **noi** — всегда **-iamo**, для всех трёх спряжений."
        ru: "Мы живём в Риме."
      - type: choice
        level: 1
        q: "Loro ___ (prendere) un caffè."
        options: ["prendano", "prendono", "prendeno", "prende"]
        answer: 1
        hint: "II спряжение (-ere): loro → **-ono**."
        ru: "Они берут кофе."
      - type: choice
        level: 2
        q: "Io ___ (capire) bene la lezione."
        options: ["capo", "capisco", "capiso", "capisci"]
        answer: 1
        hint: "capire — глагол на **-isc-**: io cap**isco**, tu cap**isci**…"
        ru: "Я хорошо понимаю урок."
      - type: choice
        level: 2
        q: "Signora, Lei ___ russa?"
        options: ["sei", "è", "siete", "sono"]
        answer: 1
        hint: "Вежливое **Lei** требует глагола в **3-м лице ед. ч.**: è."
        ru: "Синьора, Вы русская?"
      - type: cloze
        level: 2
        q: "Поставьте essere или avere."
        text: "Io [[sono]] Sofia e [[ho]] ventidue anni. Mia sorella [[è]] a Mosca, [[ha]] un gatto."
        hint: "Имя, место, качество — **essere**; возраст и владение — **avere** (по-итальянски «имею 22 года»)."
        ru: "Я София, мне двадцать два года. Моя сестра в Москве, у неё есть кот."
      - type: input
        level: 2
        q: "Voi ___ (scrivere) una lettera."
        answer: ["scrivete"]
        hint: "II спряжение: voi → **-ete**."
        ru: "Вы пишете письмо."
      - type: input
        level: 2
        q: "Marco ___ (dormire) fino alle nove."
        answer: ["dorme"]
        hint: "III спряжение без -isc-: lui → **-e**."
        ru: "Марко спит до девяти."
      - type: input
        level: 3
        q: "I bambini ___ (finire) i compiti."
        answer: ["finiscono"]
        hint: "finire с -isc-: loro → fin**iscono**."
        ru: "Дети заканчивают уроки."
      - type: choice
        level: 1
        q: "___ studente"
        options: ["un", "uno", "una", "un'"]
        answer: 1
        hint: "Мужской род перед **s + согласная** → **uno**."
        ru: "студент"
      - type: choice
        level: 1
        q: "___ amica"
        options: ["un", "una", "un'", "uno"]
        answer: 2
        hint: "Женский род перед гласной → **un'** (с апострофом). Мужской род перед гласной — un без апострофа: *un amico*."
        ru: "подруга"
      - type: error
        level: 2
        q: "Найдите ошибку."
        text: "Anna e Marco {{è=>sono}} italiani."
        hint: "Подлежащее — **два человека** (они) → loro sono."
        ru: "Анна и Марко итальянцы."
      - type: error
        level: 3
        q: "Найдите ошибку."
        text: "Ho conosciuto {{un=>un'}} attrice famosa."
        hint: "attrice — **женского** рода и начинается с гласной → un'."
        ru: "Я познакомилась с известной актрисой."
      - type: match
        level: 2
        q: "Соедините страну и национальность (ж. р.)"
        hint: "Прилагательные на -o меняют окончание на -a, на -e — не меняются."
        pairs:
          - ["Italia", "italiana"]
          - ["Russia", "russa"]
          - ["Francia", "francese"]
          - ["Spagna", "spagnola"]
          - ["Inghilterra", "inglese"]
        ru: "Италия — итальянка, Россия — русская, Франция — француженка, Испания — испанка, Англия — англичанка"
      - type: order
        level: 2
        q: "Соберите: «Как Вас зовут?» (вежливо)"
        answer: "Come si chiama Lei?"
        hint: "Вежливая форма: глагол chiamarsi в 3-м лице — **si chiama**."
        ru: "Как Вас зовут?"
      - type: dialog
        level: 1
        q: "Восстановите знакомство."
        hint: "Приветствие → вопрос об имени → ответ → «приятно познакомиться»."
        lines:
          - "Ciao, come ti chiami?"
          - "Mi chiamo Sofia. E tu?"
          - "Io sono Marco. Piacere!"
          - "Piacere mio!"
        ru: "— Привет, как тебя зовут? — Меня зовут София. А тебя? — Я Марко. Очень приятно! — Мне тоже!"

  - slug: autovalutazione-1
    kind: review
    title_it: "Che cosa hai imparato?"
    title_ru: "Самопроверка: юнит 1"
    theory: |
      ## Что вы уже умеете

      * спрягать правильные глаголы на **-are, -ere, -ire** (и **-isc-**: *capisco, finisci*);
      * ставить неопределённый артикль **un, uno, una, un'**;
      * здороваться и прощаться, говорить на **«ты»** и на **«Вы» (Lei)**;
      * описывать внешность и характер, говорить, откуда вы.
    exercises:
      - type: match
        level: 1
        q: "Соедините ситуацию и фразу"
        pairs:
          - ["поздороваться с синьорой вечером", "Buonasera, signora!"]
          - ["попрощаться с другом", "Ciao, a domani!"]
          - ["спросить, откуда человек (на «Вы»)", "Lei di dov'è?"]
          - ["описать внешность", "Ha i capelli lunghi."]
      - type: odd
        level: 1
        q: "Найдите лишнее: какое слово — не цвет глаз?"
        options: ["azzurri", "verdi", "lunghi", "marroni"]
        answer: 2
      - type: odd
        level: 2
        q: "Найдите лишнее: какой глагол спрягается с -isc-?"
        options: ["dormire", "partire", "capire", "aprire"]
        answer: 2
      - type: error
        level: 2
        q: "Найдите ошибку."
        text: "Io {{lavora=>lavoro}} in un ufficio."
      - type: error
        level: 2
        q: "Найдите ошибку."
        text: "Ho {{un=>un'}} amica a Roma."
      - type: error
        level: 3
        q: "Найдите ошибку."
        text: "Loro {{preferono=>preferiscono}} il tè."
      - type: cloze
        level: 3
        q: "Заполните пропуски."
        text: "Signora, Lei [[parla]] italiano? — Sì, e anche il russo. Mio fratello è [[*alto/alta/alti]] e [[*simpatico/simpatica/simpatici]]."
      - type: choice
        level: 2
        audio: "Buonanotte, a domani!"
        q: "🎧 Когда так говорят?"
        options: ["утром", "днём", "перед сном", "при встрече"]
        answer: 2

