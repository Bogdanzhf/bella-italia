  - slug: praktikum-10
    kind: practice
    title_it: "Esercizi: pronomi indiretti e imperativo"
    title_ru: "Практикум: косвенные местоимения и повелительное наклонение"
    theory: |
      ## Памятка

      **Косвенные местоимения** (кому?): **mi, ti, gli** (ему, им), **le** (ей), **Le** (Вам), **ci, vi**.

      * *Telefoni a Marco? — Sì, **gli** telefono.* · *Scrivi a Laura? — Sì, **le** scrivo.*
      * *piacere*: ***Mi** piace il gelato. **Gli** piacciono i film.* · В прошедшем — essere: *Ti **è piaciuto** il film? Mi **sono piaciute** le foto.*

      **Прямое или косвенное?** Зависит от итальянского глагола: *aiutare **qualcuno*** (прямое: **la** aiuto), но *telefonare **a** qualcuno* (косвенное: **le** telefono). Ориентир — предлог **a** после глагола.

      ## Повелительное наклонение

      | | parlare | prendere | sentire | finire |
      |---|---|---|---|---|
      | tu | parl**a** | prend**i** | sent**i** | fin**isci** |
      | noi | parl**iamo** | prend**iamo** | sent**iamo** | fin**iamo** |
      | voi | parl**ate** | prend**ete** | sent**ite** | fin**ite** |
      | Lei | parl**i** | prend**a** | sent**a** | fin**isca** |

      * **Отрицание на tu** = **non + инфинитив**: *Non parlare! Non mangiare troppo!*
      * Неправильные (tu): *va' / vai, fa' / fai, da' / dai, sta' / stai, di'*; *sii* (essere), *abbi* (avere).
      * Местоимения **присоединяются** к императиву на tu / noi / voi: *Scrivi**mi**! Prendi**lo**! Andiamo**ci**!* — после односложных удваивают согласную: *Di**mmi**! Fa**mmi** vedere!*
      * С **Lei** — перед глаголом: ***Mi** dica! **La** prenda!*
    exercises:
      - type: choice
        level: 1
        q: "Telefoni a tua sorella? — Sì, ___ telefono stasera."
        options: ["le", "la", "gli", "lo"]
        answer: 0
        hint: "telefonare **a** qualcuno → косвенное; sorella — ж. р. → **le**."
        ru: "Ты позвонишь сестре? — Да, позвоню ей сегодня вечером."
      - type: choice
        level: 1
        q: "Che cosa regali a Marco? — ___ regalo un libro."
        options: ["Gli", "Lo", "Le", "Li"]
        answer: 0
        hint: "regalare **a** qualcuno → «ему» = **gli**."
        ru: "Что ты подаришь Марко? — Подарю ему книгу."
      - type: choice
        level: 2
        q: "Ai bambini ___ piacciono i cartoni animati."
        options: ["gli", "li", "le", "loro"]
        answer: 0
        hint: "«им» (ai bambini) в разговорной речи → **gli**."
        ru: "Детям нравятся мультфильмы."
      - type: choice
        level: 2
        q: "Ti ___ piaciuta la festa?"
        options: ["è", "ha", "sei", "hai"]
        answer: 0
        hint: "piacere в прошедшем — с **essere**; согласование с тем, что понравилось (la festa → piaciuta)."
        ru: "Тебе понравился праздник?"
      - type: choice
        level: 2
        q: "Conosci Anna? Puoi aiutar___ con i compiti?"
        options: ["la", "le", "gli", "lo"]
        answer: 0
        hint: "aiutare **qualcuno** — без предлога → прямое местоимение: aiutar**la**."
        ru: "Ты знаешь Анну? Можешь помочь ей с уроками?"
      - type: choice
        level: 1
        q: "Marco, ___ la finestra, per favore!"
        options: ["apri", "apre", "aprite", "apra"]
        answer: 0
        hint: "Императив на **tu** у глаголов -ire → окончание **-i**."
        ru: "Марко, открой окно, пожалуйста!"
      - type: choice
        level: 2
        q: "Signora, ___ pure!"
        options: ["entra", "entri", "entrate", "entrare"]
        answer: 1
        hint: "Вежливое **Lei** у глаголов на -are → окончание **-i** (наоборот по сравнению с tu)."
        ru: "Синьора, входите, пожалуйста!"
      - type: choice
        level: 2
        q: "Non ___ così tanto, è tardi!"
        options: ["mangi", "mangia", "mangiare", "mangiate"]
        answer: 2
        hint: "Отрицательный императив на **tu** = non + **инфинитив**."
        ru: "Не ешь так много, уже поздно!"
      - type: input
        level: 2
        q: "Ragazzi, ___ (ascoltare) bene!"
        answer: ["ascoltate"]
        hint: "Императив на **voi** совпадает с настоящим временем: voi ascoltate."
        ru: "Ребята, слушайте внимательно!"
      - type: input
        level: 3
        q: "Di' + mi la verità! → ___ la verità! (одним словом)"
        answer: ["Dimmi"]
        hint: "После односложного императива (di') согласная местоимения **удваивается**: di + mmi."
        ru: "Скажи мне правду!"
      - type: input
        level: 3
        q: "Il libro è sul tavolo: prendi + lo! → ___!"
        answer: ["Prendilo"]
        hint: "Местоимение присоединяется к императиву на tu в конце слова."
        ru: "Книга на столе: возьми её!"
      - type: cloze
        level: 3
        q: "Поставьте глаголы в повелительное наклонение."
        text: "Signor Rossi, [[prenda]] (prendere, Lei) questa medicina. Lucia, [[finisci]] (finire, tu) i compiti! Bambini, [[state]] (stare, voi) zitti!"
        hint: "Lei: -ere → -a; tu: finire → finisci (-isc-); voi: как в настоящем — state."
        ru: "Синьор Росси, примите это лекарство. Лючия, закончи уроки! Дети, замолчите!"
      - type: error
        level: 2
        q: "Найдите ошибку."
        text: "Ho visto Laura e {{la=>le}} ho detto tutto."
        hint: "dire **a** qualcuno → косвенное местоимение; Laura — ж. р. → le."
        ru: "Я увидела Лауру и сказала ей всё."
      - type: error
        level: 3
        q: "Найдите ошибку."
        text: "Non {{parla=>parlare}} con la bocca piena!"
        hint: "Отрицательный императив на tu = non + инфинитив."
        ru: "Не разговаривай с набитым ртом!"
      - type: match
        level: 2
        q: "Соедините инфинитив и императив на tu"
        hint: "Короткие формы неправильных глаголов — с апострофом."
        pairs:
          - ["andare", "va'"]
          - ["fare", "fa'"]
          - ["dire", "di'"]
          - ["essere", "sii"]
          - ["avere", "abbi"]
        ru: "идти, делать, говорить, быть, иметь — «иди!, делай!, скажи!, будь!, имей!»"

  - slug: autovalutazione-10
    kind: review
    title_it: "Che cosa hai imparato?"
    title_ru: "Самопроверка: юнит 10"
    theory: |
      ## Что вы уже умеете

      * заменять дополнение «кому?» местоимениями **mi, ti, gli, le, Le, ci, vi**;
      * говорить, что понравилось: *mi è piaciuto il film, mi sono piaciute le scarpe*;
      * давать советы и инструкции в **imperativo**, в том числе отрицательно: *non mangiare!*;
      * присоединять местоимения: *dimmi, fallo, prendilo*;
      * объяснять дорогу и просить об одолжении.
    exercises:
      - type: match
        level: 1
        q: "Соедините"
        pairs:
          - ["Mi dai una mano?", "Certo, volentieri!"]
          - ["Scusi, per la stazione?", "Vada sempre dritto."]
          - ["Ti è piaciuto il film?", "Sì, moltissimo!"]
          - ["Mi presti la penna?", "Prendila pure!"]
      - type: odd
        level: 1
        q: "Найдите лишнее: что не телепередача?"
        options: ["telegiornale", "documentario", "cartoni animati", "semaforo"]
        answer: 3
      - type: error
        level: 2
        q: "Найдите ошибку."
        text: "Telefono a Maria e {{gli=>le}} dico tutto."
      - type: error
        level: 2
        q: "Найдите ошибку."
        text: "Paolo, non {{mangia=>mangiare}} troppi dolci!"
      - type: error
        level: 3
        q: "Найдите ошибку."
        text: "Mi sono {{piaciuto=>piaciute}} molto le tue foto."
      - type: cloze
        level: 3
        q: "Заполните пропуски."
        text: "Il libro? [[Prendilo]] pure! Di' a me la verità → [[Dimmi]] la verità! A Marco? [[Gli]] ho scritto ieri."
      - type: choice
        level: 2
        audio: "Gira a sinistra al semaforo."
        q: "🎧 Где нужно повернуть налево?"
        options: ["на перекрёстке", "на светофоре", "у моста", "у церкви"]
        answer: 1

