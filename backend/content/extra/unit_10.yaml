lessons_before:
  - slug: dialogo-tv
    kind: dialogue
    title_it: "Mi presti il telecomando?"
    title_ru: "Дашь мне пульт?"
    dialogue:
      title: "Una serata in casa"
      scene: "София ужинает у Джанны. После ужина они выбирают, что посмотреть, а потом София спрашивает дорогу."
      lines:
        - "Gianna: Che cosa guardiamo stasera? C'è un film su Rai Uno. | Что посмотрим сегодня? На «Раи Уно» идёт фильм."
        - "Sofia: Che film è? | Какой фильм?"
        - "Gianna: Una commedia con Paola Cortellesi. Ti piacciono le commedie? | Комедия с Паолой Кортеллези. Тебе нравятся комедии?"
        - "Sofia: Sì, moltissimo! Mi passi il telecomando? Alzo il volume. | Да, очень! Передашь мне пульт? Сделаю погромче."
        - "Gianna: Eccolo, prendilo! E non dimenticare: domani mi devi aiutare con il trasloco! | Вот, бери! И не забудь: завтра ты должна помочь мне с переездом!"
        - "Sofia: Certo, ci vengo volentieri. Ma come arrivo a casa tua nuova? | Конечно, с удовольствием приду. Но как добраться до твоего нового дома?"
        - "Gianna: È facile. Scendi dalla metro in piazza Duomo, va' sempre dritto e al primo incrocio gira a destra. | Легко. Выйди из метро на площади Дуомо, иди прямо и на первом перекрёстке поверни направо."
        - "Sofia: Poi? | А потом?"
        - "Gianna: Poi prendi la seconda strada a sinistra: è il numero dodici. Scrivimi quando arrivi! | Потом сверни на вторую улицу налево: дом номер двенадцать. Напиши мне, когда приедешь!"
        - "Sofia: Va bene. Ah, Gianna, mi presti anche un ombrello? Domani pioverà. | Хорошо. Ах, Джанна, одолжишь мне ещё зонт? Завтра будет дождь."
        - "Gianna: Ma certo, tienilo pure! | Ну конечно, оставь себе!"
    words:
      - "il volume | громкость"
      - "alzare il volume | сделать громче"
      - "scrivimi | напиши мне"
      - "tienilo | оставь себе"
    phrases:
      - "Mi passi il telecomando? | Передашь мне пульт?"
      - "Prendilo! | Бери!"
      - "Va' sempre dritto. | Иди прямо."
      - "Al primo incrocio gira a destra. | На первом перекрёстке поверни направо."
      - "Scrivimi quando arrivi! | Напиши, когда приедешь!"
    exercises:
      - type: tf
        level: 1
        ref: dialogue
        q: "Верно или неверно?"
        items:
          - ["Su Rai Uno c'è un film drammatico.", false]
          - ["A Sofia piacciono le commedie.", true]
          - ["Domani Sofia aiuterà Gianna con il trasloco.", true]
          - ["La casa nuova di Gianna è al numero venti.", false]
      - type: choice
        level: 2
        audio: "Al primo incrocio gira a destra, poi la seconda strada a sinistra."
        q: "🎧 Куда повернуть на первом перекрёстке?"
        options: ["налево", "направо", "прямо", "назад"]
        answer: 1
      - type: cloze
        level: 2
        ref: dialogue
        q: "Заполните пропуски повелительным наклонением."
        text: "[[Va']] sempre dritto e al primo incrocio [[gira]] a destra. [[Scrivimi]] quando arrivi!"
      - type: dialog
        level: 2
        q: "Восстановите диалог."
        lines:
          - "Scusi, per il Duomo?"
          - "Vada sempre dritto e poi giri a sinistra."
          - "È lontano?"
          - "No, cinque minuti a piedi."

lessons_after:
  - slug: tv-giornali
    kind: culture
    title_it: "Televisione e giornali in Italia"
    title_ru: "Телевидение и газеты Италии"
    reading:
      title: "Che c'è in TV?"
      photo: p-sanremo-ariston
      text: |
        La televisione italiana nasce nel 1954 con la RAI. All'inizio c'era un solo canale e le famiglie guardavano la TV tutte insieme, spesso al bar.
        Negli anni Sessanta la TV ha aiutato molti italiani a imparare la lingua italiana: prima tante persone parlavano solo il dialetto!
        Oggi ci sono molti canali: la RAI è la televisione pubblica, Mediaset è privata.
        Tra i giornali più letti ci sono il Corriere della Sera e la Repubblica. La Gazzetta dello Sport è stampata su carta rosa e organizza il Giro d'Italia, una famosa corsa in bicicletta.
        Ogni anno, a febbraio, milioni di italiani guardano in TV il Festival di Sanremo.
      ru: |
        Итальянское телевидение родилось в 1954 году вместе с RAI. Поначалу был только один канал, и семьи смотрели телевизор все вместе, часто в баре.
        В шестидесятые телевидение помогло многим итальянцам выучить итальянский язык: раньше многие говорили только на диалекте!
        Сегодня каналов много: RAI — общественное телевидение, Mediaset — частное.
        Среди самых читаемых газет — «Коррьере делла Сера» и «Репубблика». «Гадзетта делло Спорт» печатается на розовой бумаге и организует «Джиро д'Италия» — знаменитую велогонку.
        Каждый год в феврале миллионы итальянцев смотрят по телевизору фестиваль в Сан-Ремо.
      glossary:
        - "pubblico | общественный, государственный"
        - "privato | частный"
        - "stampato | напечатанный"
        - "la corsa in bicicletta | велогонка"
    words:
      - "il canale | канал"
      - "pubblico | общественный"
      - "la corsa | гонка, забег"
      - "stampare | печатать"
    exercises:
      - type: tf
        level: 1
        ref: reading
        q: "Верно или неверно?"
        items:
          - ["La RAI nasce nel 1954.", true]
          - ["Mediaset è la televisione pubblica.", false]
          - ["La Gazzetta dello Sport è rosa.", true]
          - ["Il Festival di Sanremo è a luglio.", false]
      - type: choice
        level: 2
        ref: reading
        q: "Как телевидение помогло итальянцам в шестидесятые?"
        options: ["Научило готовить", "Помогло выучить итальянский язык", "Помогло найти работу", "Научило кататься на велосипеде"]
        answer: 1
      - type: match
        level: 2
        q: "Соедините"
        pairs:
          - ["la RAI", "televisione pubblica"]
          - ["la Gazzetta dello Sport", "il Giro d'Italia"]
          - ["Sanremo", "festival della musica"]

  - slug: dialogo-telefonata
    kind: dialogue
    title_it: "Dove sei? Sto arrivando!"
    title_ru: "Ты где? Я уже иду!"
    dialogue:
      title: "Una telefonata in ritardo"
      scene: "Лоренцо приехал в Рим. Они с Софией договорились встретиться у фонтана Треви, но София опаздывает."
      lines:
        - "Lorenzo: Pronto, Sofia? Dove sei? Ti sto aspettando da venti minuti! | Алло, София? Ты где? Я жду тебя уже двадцать минут!"
        - "Sofia: Scusa, scusa! Sto arrivando, sto correndo verso la fermata. | Прости, прости! Я уже иду, бегу к остановке."
        - "Lorenzo: Ma che cosa stavi facendo? | Да чем ты была занята?"
        - "Sofia: Stavo finendo i compiti di italiano e non ho guardato l'orologio. | Заканчивала домашнее задание по итальянскому и не посмотрела на часы."
        - "Lorenzo: Va bene, va bene. Intanto sto prendendo un caffè al bar qui di fronte. | Ладно, ладно. Пока я пью кофе в баре напротив."
        - "Sofia: Perfetto! L'autobus sta per partire, ci vediamo tra dieci minuti. | Отлично! Автобус вот-вот отправится, увидимся через десять минут."
        - "Lorenzo: Ti sento malissimo… Stai parlando in autobus? | Я тебя очень плохо слышу… Ты говоришь из автобуса?"
        - "Sofia: Sì, e c'è un signore che sta cantando! Ti richiamo appena scendo. | Да, и тут какой-то синьор поёт! Перезвоню, как только выйду."
        - "Lorenzo: Non preoccuparti. Mentre ti aspetto, guardo la fontana. È bellissima! | Не волнуйся. Пока жду тебя, смотрю на фонтан. Он прекрасен!"
    words:
      - "aspettare | ждать"
      - "c`orrere | бежать"
      - "la fermata | остановка"
      - "l'orologio | часы | m"
      - "intanto | тем временем, пока"
      - "di fronte | напротив"
      - "richiamare | перезвонить"
      - "appena | как только; едва"
      - "la fontana | фонтан"
      - "la telefonata | телефонный звонок"
      - "il messaggio | сообщение"
      - "la batteria | батарея, аккумулятор"
      - "la l`inea | линия, связь"
    phrases:
      - "Ti sto aspettando da venti minuti! | Я жду тебя уже двадцать минут!"
      - "Sto arrivando! | Я уже иду! (Уже подъезжаю!)"
      - "L'autobus sta per partire. | Автобус вот-вот отправится."
      - "Ti richiamo appena scendo. | Перезвоню, как только выйду."
      - "Ti sento malissimo. | Я тебя очень плохо слышу."
      - "Il telefono è quasi scarico. | Телефон почти разрядился."
    exercises:
      - type: tf
        level: 1
        ref: dialogue
        q: "Верно или неверно?"
        hint: "Обратите внимание на формы **stare + gerundio**: они описывают, кто что делает прямо сейчас."
        items:
          - ["Lorenzo sta aspettando Sofia.", true]
          - ["Sofia stava dormendo.", false]
          - ["Lorenzo sta prendendo un caffè.", true]
          - ["Sofia è già arrivata alla fontana.", false]
        ru: "1. Лоренцо ждёт Софию. 2. София спала. 3. Лоренцо пьёт кофе. 4. София уже пришла к фонтану."
      - type: choice
        level: 1
        ref: dialogue
        q: "Что делала София, когда опоздала?"
        options: ["Stava finendo i compiti", "Stava cucinando", "Stava telefonando alla mamma", "Stava facendo la spesa"]
        answer: 0
        hint: "**stavo + gerundio** — «я как раз делала» в прошлом. Ищите реплику со словом stavo."
        ru: "Она заканчивала домашнее задание."
      - type: choice
        level: 2
        audio: "L'autobus sta per partire."
        q: "🎧 Что сейчас произойдёт?"
        options: ["Автобус уже уехал", "Автобус вот-вот отправится", "Автобус сломался", "Автобус опаздывает"]
        answer: 1
        hint: "**stare per + инфинитив** = «вот-вот, сейчас» (действие ещё не началось)."
        ru: "«Автобус вот-вот отправится»."
      - type: cloze
        level: 2
        ref: dialogue
        q: "Заполните пропуски по диалогу."
        text: "Ti sto [[aspettando]] da venti minuti! — Scusa, sto [[arrivando]]! — Ma che cosa stavi [[facendo]]?"
        hint: "После форм **stare** — герундий: aspettare → aspettando, arrivare → arrivando, fare → facendo (особая форма)."
        ru: "Я жду тебя уже двадцать минут! — Прости, я уже иду! — Да чем ты была занята?"
      - type: dialog
        level: 2
        q: "Восстановите телефонный разговор."
        hint: "Алло → где ты → ответ со stare + gerundio → договорённость о встрече."
        lines:
          - "Pronto, dove sei?"
          - "Sto arrivando, sono quasi in piazza."
          - "Va bene, ti aspetto al bar."
          - "Perfetto, a tra poco!"
        ru: "— Алло, ты где? — Я уже иду, почти на площади. — Хорошо, жду тебя в баре. — Отлично, до скорого!"
  - slug: gerundio-stare
    kind: grammar
    title_it: "Che cosa stai facendo?"
    title_ru: "Герундий и stare + gerundio"
    theory: |
      ## Как образовать герундий

      | спряжение | окончание | пример |
      |---|---|---|
      | -are | **-ando** | parl**ando**, guard**ando** |
      | -ere | **-endo** | prend**endo**, legg**endo** |
      | -ire | **-endo** | part**endo**, fin**endo** |

      Герундий **не изменяется** по лицам и родам.

      **Особые формы** (от старой основы глагола):

      | | | |
      |---|---|---|
      | fare → **facendo** | dire → **dicendo** | bere → **bevendo** |
      | porre → **ponendo** | tradurre → **traducendo** | trarre → **traendo** |

      *essere → essendo, avere → avendo* — правильные.

      ## Stare + gerundio: «прямо сейчас»

      **stare** (спрягается) + **герундий** = действие в процессе, как английское *-ing*:

      | | | |
      |---|---|---|
      | io **sto** | noi **stiamo** | + mangiando |
      | tu **stai** | voi **state** | + leggendo |
      | lui / lei **sta** | loro **stanno** | + dormendo |

      * *Che cosa **stai facendo**? — **Sto studiando**.* — Что ты делаешь (сейчас)? — Занимаюсь.
      * В прошлом — **imperfetto** от stare: *Quando hai chiamato, **stavo cucinando**.* — Когда ты позвонил, я (как раз) готовила.

      > 💡 Не используйте stare + gerundio с глаголами состояния (*essere, avere, sapere, conoscere*): не *sto sapendo*, а *so*.

      ## Stare per + infinito: «вот-вот»

      * *Il film **sta per cominciare**.* — Фильм вот-вот начнётся.
      * *Stavo per uscire, quando è arrivata Gianna.* — Я уже собиралась выходить, когда пришла Джанна.

      ## Местоимения и герундий

      Безударные местоимения **присоединяются** к герундию: *guardando**la***, *leggendo**lo***.
      С **stare** их можно поставить и перед stare: ***Lo** sto leggendo* = *Sto leggendo**lo***.
    words:
      - "studiare | заниматься, учиться"
      - "cucinare | готовить (еду)"
      - "dormire | спать"
      - "piovere | идти (о дожде)"
      - "cominciare | начинать(ся)"
      - "finire | заканчивать(ся)"
      - "uscire | выходить"
      - "tradurre | переводить"
      - "il compito | задание"
      - "la lettera | письмо"
      - "il giornale | газета"
      - "adesso | сейчас"
      - "proprio | именно, как раз"
    phrases:
      - "Che cosa stai facendo? — Sto studiando. | Что ты делаешь? — Занимаюсь."
      - "Sta piovendo. | Идёт дождь."
      - "Il film sta per cominciare. | Фильм вот-вот начнётся."
      - "Stavo per uscire. | Я как раз собиралась выходить."
      - "Lo sto leggendo adesso. | Я как раз читаю это сейчас."
    exercises:
      - type: input
        level: 1
        q: "parlare → ___ (герундий)"
        answer: ["parlando"]
        hint: "Глаголы на **-are** → основа + **-ando**."
        ru: "говорить → говоря"
      - type: input
        level: 1
        q: "leggere → ___ (герундий)"
        answer: ["leggendo"]
        hint: "Глаголы на **-ere** → основа + **-endo**."
        ru: "читать → читая"
      - type: input
        level: 1
        q: "partire → ___ (герундий)"
        answer: ["partendo"]
        hint: "Глаголы на **-ire** тоже получают **-endo** (не -indo!)."
        ru: "уезжать → уезжая"
      - type: input
        level: 2
        q: "fare → ___ (герундий)"
        answer: ["facendo"]
        hint: "Особая форма от старой основы fac- (лат. facere)."
        ru: "делать → делая"
      - type: input
        level: 2
        q: "dire → ___ (герундий)"
        answer: ["dicendo"]
        hint: "Особая форма от основы dic-: как в dico, dici."
        ru: "говорить → говоря"
      - type: input
        level: 2
        q: "bere → ___ (герундий)"
        answer: ["bevendo"]
        hint: "Основа bev- (как в bevo, bevi)."
        ru: "пить → выпивая"
      - type: choice
        level: 1
        q: "Che cosa ___ facendo, ragazzi?"
        options: ["state", "stanno", "stiamo", "stai"]
        answer: 0
        hint: "**ragazzi** — обращаемся к «вам» (voi) → **state**."
        ru: "Что вы делаете, ребята?"
      - type: choice
        level: 2
        q: "Quando mi hai telefonato, ___ la doccia."
        options: ["sto facendo", "stavo facendo", "ho fatto", "starò facendo"]
        answer: 1
        hint: "Длительное действие **в прошлом**, прерванное звонком → **imperfetto** от stare + gerundio."
        ru: "Когда ты мне позвонил, я принимала душ."
      - type: choice
        level: 2
        q: "Corri! Il treno ___ partire!"
        options: ["sta per", "sta", "sta a", "stava"]
        answer: 0
        hint: "«Вот-вот» = **stare per + инфинитив**."
        ru: "Беги! Поезд вот-вот отправится!"
      - type: choice
        level: 3
        q: "Как правильно сказать «Я это знаю»?"
        options: ["Lo sto sapendo.", "Lo so.", "Sto saperlo.", "Lo sto per sapere."]
        answer: 1
        hint: "Глаголы состояния (essere, avere, **sapere**, conoscere) не употребляются в stare + gerundio."
        ru: "Я это знаю."
      - type: cloze
        level: 2
        q: "Поставьте stare + gerundio в настоящем."
        text: "Io [[sto]] leggendo, Marco sta [[dormendo]] (dormire), i bambini [[stanno]] giocando, e voi cosa [[state]] facendo?"
        hint: "Спрягайте stare: io sto, lui sta, loro stanno, voi state. Герундий от dormire — dormendo."
        ru: "Я читаю, Марко спит, дети играют, а вы что делаете?"
      - type: error
        level: 2
        q: "Найдите ошибку."
        text: "Il professore sta {{traduciendo=>traducendo}} una lettera."
        hint: "tradurre → основа traduc- + **-endo**, без лишней i."
        ru: "Профессор переводит письмо."
      - type: error
        level: 3
        q: "Найдите ошибку."
        text: "Guarda fuori: {{è=>sta}} piovendo!"
        hint: "Длительное действие «прямо сейчас» строится только со **stare** + герундий."
        explain: "Правильно: «Sta piovendo!» — с глаголом stare, а не essere."
        ru: "Посмотри в окно: идёт дождь!"
      - type: order
        level: 2
        q: "Соберите: «Фильм вот-вот начнётся.»"
        answer: "Il film sta per cominciare."
        hint: "Подлежащее + **sta per** + инфинитив."
        ru: "Фильм вот-вот начнётся."
      - type: order
        level: 3
        q: "Соберите: «Я как раз читаю это (письмо) сейчас.»"
        answer: "La sto leggendo adesso."
        hint: "Местоимение la (lettera — ж. р.) можно поставить **перед stare**."
        ru: "Я как раз его (письмо) сейчас читаю."
  - slug: telefono-messaggi
    kind: lesson
    title_it: "Pronto? Chi parla?"
    title_ru: "Телефон и сообщения"
    theory: |
      ## Как говорят по телефону

      | ситуация | по-итальянски |
      |---|---|
      | ответить на звонок | *Pronto?* · *Pronto, chi parla?* |
      | представиться | *Sono Sofia.* · *Parla Sofia Ivanova.* (официально) |
      | попросить кого-то | *Posso parlare con Lorenzo?* · *C'è Gianna?* |
      | «Минутку» | *Un attimo, per favore.* · *Aspetti un momento.* (вежливо) |
      | человека нет | *Non c'è, vuole lasciare un messaggio?* |
      | плохая связь | *Non ti sento bene.* · *È caduta la linea.* · *Non c'è campo.* |
      | перезвонить | *Ti richiamo più tardi.* · *Mi può richiamare?* |
      | ошиблись номером | *Scusi, ho sbagliato numero.* |

      ## Сообщения: сокращения

      В чатах итальянцы пишут коротко: **cmq** = comunque (всё равно), **xké** = perché, **tvb** = ti voglio bene,
      **nn** = non, **x** = per, **qlc** = qualcosa. В письменной речи сокращения не используйте.

      > 💡 Голосовое сообщение — *il vocale* (*Ti mando un vocale.*), смс — *il messaggio*, пропущенный звонок — *la chiamata persa*.
    words:
      - "chiamare | звонить, звать"
      - "la chiamata | звонок"
      - "lasciare | оставлять"
      - "il numero | номер"
      - "sbagliare numero | ошибиться номером"
      - "il campo | сеть, связь (мобильная)"
      - "cad`ere | падать; обрываться (о связи)"
      - "il cellulare | мобильный телефон"
      - "il vocale | голосовое сообщение"
      - "la segreter`ia | автоответчик"
      - "occupato | занятый"
    phrases:
      - "Pronto, chi parla? | Алло, кто говорит?"
