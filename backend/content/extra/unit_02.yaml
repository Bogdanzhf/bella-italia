lessons_before:
  - slug: dialogo-tempo-libero
    kind: dialogue
    title_it: "Che cosa fai sabato?"
    title_ru: "Что ты делаешь в субботу?"
    dialogue:
      title: "Un invito"
      scene: "Лоренцо звонит Софии в пятницу вечером."
      lines:
        - "Lorenzo: Pronto, Sofia? Sono Lorenzo. Che cosa fai domani? | Алло, София? Это Лоренцо. Что ты делаешь завтра?"
        - "Sofia: Ciao! La mattina vado in palestra. Perché? | Привет! Утром иду в спортзал. А что?"
        - "Lorenzo: Il pomeriggio andiamo al lago con Gianna. Vieni con noi? | Днём мы едем на озеро с Джанной. Поедешь с нами?"
        - "Sofia: Volentieri! A che ora partite? | С удовольствием! Во сколько вы выезжаете?"
        - "Lorenzo: Alle due e mezza, dalla stazione Centrale. Prendiamo il treno. | В половине третьего, с Центрального вокзала. Едем на поезде."
        - "Sofia: Perfetto. Devo comprare il biglietto? | Отлично. Мне нужно купить билет?"
        - "Lorenzo: Sì, lo puoi comprare online o in biglietteria. | Да, можешь купить онлайн или в кассе."
        - "Sofia: E la sera? Torniamo presto? | А вечером? Вернёмся рано?"
        - "Lorenzo: Verso le nove. Poi, se vuoi, andiamo a mangiare una pizza. | Около девяти. Потом, если хочешь, пойдём съедим пиццу."
        - "Sofia: Che bella idea! Allora a domani! | Отличная идея! Тогда до завтра!"
        - "Lorenzo: A domani, ciao! | До завтра, пока!"
    words:
      - "verso | около (о времени)"
      - "online | онлайн"
      - "la stazione Centrale | Центральный вокзал"
    phrases:
      - "Che cosa fai domani? | Что ты делаешь завтра?"
      - "Vieni con noi? | Пойдёшь с нами?"
      - "A che ora partite? | Во сколько вы выезжаете?"
      - "Che bella idea! | Отличная идея!"
    exercises:
      - type: tf
        level: 1
        ref: dialogue
        q: "Верно или неверно?"
        items:
          - ["La mattina Sofia va in palestra.", true]
          - ["Vanno al mare.", false]
          - ["Partono alle due e mezza.", true]
          - ["Tornano a mezzanotte.", false]
      - type: choice
        level: 1
        ref: dialogue
        q: "На чём ребята поедут на озеро?"
        options: ["in macchina", "in treno", "in autobus", "a piedi"]
        answer: 1
      - type: choice
        level: 2
        audio: "Partiamo alle due e mezza."
        q: "🎧 Во сколько они выезжают?"
        options: ["2:00", "2:30", "12:30", "3:30"]
        answer: 1
      - type: dialog
        level: 2
        q: "Восстановите приглашение."
        lines:
          - "Vieni al cinema stasera?"
          - "Volentieri! A che ora?"
          - "Alle otto e mezza."
          - "Perfetto, a stasera!"
      - type: cloze
        level: 3
        ref: dialogue
        q: "Заполните пропуски."
        text: "Sofia [[va]] in palestra la mattina. Il pomeriggio Lorenzo, Gianna e Sofia [[vanno]] al lago. [[Prendono]] il treno."

lessons_after:
  - slug: tempo-libero-italiani
    kind: culture
    title_it: "Il tempo libero degli italiani"
    title_ru: "Свободное время итальянцев"
    reading:
      title: "Che cosa fanno gli italiani nel tempo libero?"
      photo: p-roma-trastevere
      text: |
        Nel tempo libero molti italiani guardano la televisione, leggono o ascoltano musica.
        Il calcio è lo sport più amato: la domenica tanti tifosi vanno allo stadio o guardano la partita al bar con gli amici.
        Gli italiani amano anche passeggiare: la sera, soprattutto d'estate, fanno la "passeggiata" in centro e prendono un gelato.
        Nel fine settimana molte famiglie vanno al mare, in montagna o in campagna.
        Nelle grandi città le persone usano i mezzi pubblici: l'autobus, il tram e la metropolitana. A Venezia c'è il vaporetto, un autobus sull'acqua!
      ru: |
        В свободное время многие итальянцы смотрят телевизор, читают или слушают музыку.
        Футбол — самый любимый спорт: по воскресеньям многие болельщики ходят на стадион или смотрят матч в баре с друзьями.
        Итальянцы любят и гулять: вечером, особенно летом, они устраивают «пасседжату» — прогулку по центру — и едят мороженое.
        На выходных многие семьи едут на море, в горы или за город.
        В больших городах люди пользуются общественным транспортом: автобусом, трамваем и метро. В Венеции есть вапоретто — автобус на воде!
      glossary:
        - "il tifoso | болельщик"
        - "più amato | самый любимый"
        - "soprattutto | особенно"
        - "i mezzi pubblici | общественный транспорт"
    photos: [p-gondola, p-spiaggia-italia, p-dolomiti]
    words:
      - "il tifoso | болельщик"
      - "la partita | матч"
      - "soprattutto | особенно"
      - "i mezzi pubblici | общественный транспорт"
    exercises:
      - type: tf
        level: 1
        ref: reading
        q: "Верно или неверно?"
        items:
          - ["Lo sport più amato in Italia è il tennis.", false]
          - ["La sera gli italiani fanno la passeggiata.", true]
          - ["Il vaporetto è un autobus sull'acqua.", true]
      - type: match
        level: 1
        q: "Соедините место и занятие"
        pairs:
          - ["allo stadio", "guardare la partita"]
          - ["al mare", "prendere il sole"]
          - ["in montagna", "camminare"]
          - ["in centro", "fare la passeggiata"]
      - type: odd
        level: 2
        q: "Найдите лишнее: что не транспорт?"
        options: ["tram", "vaporetto", "metropolitana", "palestra"]
        answer: 3
      - type: cloze
        level: 2
        ref: reading
        q: "Заполните пропуски по тексту."
        text: "La domenica i tifosi vanno allo [[stadio]]. A Venezia c'è il [[*vaporetto/tram/treno]]."

  - slug: praktikum-2
    kind: practice
    title_it: "Esercizi: verbi irregolari, modali e preposizioni"
    title_ru: "Практикум: неправильные и модальные глаголы, предлоги"
    theory: |
      ## Памятка

      **Неправильные глаголы**

      | | fare | andare | venire | uscire | stare | dare | dire | bere |
      |---|---|---|---|---|---|---|---|---|
      | io | faccio | vado | vengo | esco | sto | do | dico | bevo |
      | tu | fai | vai | vieni | esci | stai | dai | dici | bevi |
      | lui | fa | va | viene | esce | sta | dà | dice | beve |
      | noi | facciamo | andiamo | veniamo | usciamo | stiamo | diamo | diciamo | beviamo |
      | voi | fate | andate | venite | uscite | state | date | dite | bevete |
      | loro | fanno | vanno | vengono | escono | stanno | danno | dicono | bevono |

      **Модальные** (+ инфинитив): **volere** (voglio, vuoi, vuole, vogliamo, volete, vogliono), **potere** (posso, puoi, può, possiamo, potete, possono), **dovere** (devo, devi, deve, dobbiamo, dovete, devono).
      *Voglio dormire. Posso entrare? Devi studiare.*

      **Предлоги места**

      * **a** + город: *a Roma*; **in** + страна, регион, «тип места»: *in Italia, in banca, in ufficio, in piazza*;
      * **a** + некоторые места: *a casa, a scuola, a teatro, a letto*;
      * **da** + человек: *vado **da** Marco, **dal** medico* (к кому-то);
      * **di** — происхождение: *Sono **di** Mosca*; **da** — откуда пришёл: *Vengo **da** Mosca*.

      > 💡 Время: *Che ora è? — È l'una. Sono le tre e mezza.* (часы — женский род мн. ч., кроме «час»).
    exercises:
      - type: choice
        level: 1
        q: "Che cosa ___ (fare) stasera, ragazzi?"
        options: ["fate", "fanno", "facciamo", "fai"]
        answer: 0
        hint: "ragazzi = **voi** → fare: voi **fate**."
        ru: "Что вы делаете сегодня вечером, ребята?"
      - type: choice
        level: 1
        q: "Io ___ (andare) al cinema con Gianna."
        options: ["vado", "ando", "va", "vai"]
        answer: 0
        hint: "andare — неправильный: io **vado**."
        ru: "Я иду в кино с Джанной."
      - type: choice
        level: 2
        q: "Loro ___ (venire) alla festa?"
        options: ["venono", "vengono", "vengano", "vieneno"]
        answer: 1
        hint: "venire: io ven**g**o … loro ven**g**ono — в 1-м лице ед. ч. и 3-м лице мн. ч. появляется **g**."
        ru: "Они придут на праздник?"
      - type: choice
        level: 2
        q: "Stasera noi ___ (uscire) con gli amici."
        options: ["usciamo", "esciamo", "uscimo", "escono"]
        answer: 0
        hint: "uscire: в формах noi и voi корень **usc-**, в остальных — **esc-**."
        ru: "Сегодня вечером мы идём гулять с друзьями."
      - type: input
        level: 2
        q: "Che cosa ___ (dire) tu?"
        answer: ["dici"]
        hint: "dire спрягается от основы **dic-**: dico, dici, dice…"
        ru: "Что ты говоришь?"
      - type: input
        level: 2
        q: "Io non ___ (bere) il caffè la sera."
        answer: ["bevo"]
        hint: "bere спрягается от основы **bev-**: bevo, bevi, beve…"
        ru: "Я не пью кофе вечером."
      - type: choice
        level: 1
        q: "Scusi, ___ entrare?"
        options: ["posso", "voglio", "devo", "so"]
        answer: 0
        hint: "Просим разрешения → **potere** («можно?»)."
        ru: "Простите, можно войти?"
      - type: choice
        level: 2
        q: "Domani abbiamo un esame: ___ studiare."
        options: ["possiamo", "dobbiamo", "vogliamo", "sappiamo"]
        answer: 1
        hint: "Необходимость, обязанность → **dovere**: noi **dobbiamo**."
        ru: "Завтра у нас экзамен: мы должны заниматься."
      - type: input
        level: 3
        q: "Mia madre non ___ (volere) uscire."
        answer: ["vuole"]
        hint: "volere: lui / lei **vuole**."
        ru: "Моя мама не хочет выходить."
      - type: cloze
        level: 2
        q: "Вставьте a, in или da."
        text: "Abito [[a]] Milano, ma lavoro [[in]] banca. Stasera vado [[da]] Lorenzo e domani [[in]] Francia."
        hint: "a + город; in + «тип места» (banca, ufficio) и страна; da + человек."
        ru: "Я живу в Милане, но работаю в банке. Сегодня вечером иду к Лоренцо, а завтра — во Францию."
      - type: choice
        level: 2
        q: "Sono ___ Mosca, ma abito a Roma."
        options: ["di", "da", "a", "in"]
        answer: 0
        hint: "Происхождение «я из (родом из) …» → **essere di**."
        ru: "Я из Москвы, но живу в Риме."
      - type: error
        level: 2
        q: "Найдите ошибку."
        text: "Stasera vado {{a=>da}} Gianna per cena."
        hint: "К **человеку** (к кому-то домой) — предлог **da**."
        ru: "Сегодня вечером я иду к Джанне на ужин."
      - type: error
        level: 2
        q: "Найдите ошибку."
        text: "Il film comincia {{alla=>alle}} nove."
        hint: "Часы — женского рода **мн. ч.** (le nove) → a + le = **alle**. Только «час» — all'una."
        ru: "Фильм начинается в девять."
      - type: choice
        level: 2
        q: "Che ore sono? — ___ le otto e un quarto."
        options: ["È", "Sono", "Ha", "Fa"]
        answer: 1
        hint: "Для всех часов, кроме «час» (È l'una), — **sono** le…"
        ru: "Который час? — Четверть девятого."
      - type: match
        level: 1
        q: "Соедините инфинитив и форму io"
        hint: "Все эти глаголы неправильные — вспомните таблицу."
        pairs:
          - ["fare", "faccio"]
          - ["andare", "vado"]
          - ["venire", "vengo"]
          - ["uscire", "esco"]
          - ["stare", "sto"]
        ru: "делать, идти, приходить, выходить, находиться — форма «я»"
      - type: order
        level: 2
        q: "Соберите: «Ты хочешь пойти в кино?»"
        answer: "Vuoi andare al cinema?"
        hint: "Модальный глагол (vuoi) + инфинитив (andare) + место."
        ru: "Ты хочешь пойти в кино?"

  - slug: autovalutazione-2
    kind: review
    title_it: "Che cosa hai imparato?"
    title_ru: "Самопроверка: юнит 2"
    theory: |
      ## Что вы уже умеете

      * говорить о свободном времени: неправильные глаголы **andare, venire, fare, uscire, bere, dire…**;
      * приглашать, соглашаться и отказываться; модальные **potere, volere, dovere**;
      * описывать квартиру, считать до 2000, называть порядковые числа;
      * употреблять предлоги **di, a, da, in, con, su, per, tra/fra**;
      * называть дни недели и говорить, который час; ездить на транспорте.
    exercises:
      - type: match
        level: 1
        q: "Соедините ситуацию и фразу"
        pairs:
          - ["пригласить", "Vieni al cinema con me?"]
          - ["принять приглашение", "Volentieri!"]
          - ["отказаться", "Mi dispiace, non posso."]
          - ["спросить время", "Che ore sono?"]
      - type: odd
        level: 1
        q: "Найдите лишнее: что не день недели?"
        options: ["lunedì", "sabato", "mese", "giovedì"]
        answer: 2
      - type: odd
        level: 2
        q: "Найдите лишнее: что не комната?"
        options: ["cucina", "bagno", "soggiorno", "balcone"]
        answer: 3
      - type: error
        level: 2
        q: "Найдите ошибку."
        text: "Io {{vengo=>vado}} al cinema stasera con Marco."
        explain: "О движении «туда» говорим andare; venire — «прийти сюда / с кем-то»."
      - type: error
        level: 2
        q: "Найдите ошибку."
        text: "Tu {{puoi=>vuoi}} venire? Sì, voglio venire!"
      - type: error
        level: 3
        q: "Найдите ошибку."
        text: "Abito {{in=>a}} Milano da tre anni."
      - type: cloze
        level: 3
        q: "Заполните пропуски предлогами."
        text: "Vado [[a]] scuola [[in]] autobus. Studio l'italiano [[da]] un anno. La lezione finisce [[tra|fra]] dieci minuti."
      - type: choice
        level: 2
        audio: "Sono le sette meno un quarto."
        q: "🎧 Который час?"
        options: ["7:15", "6:45", "7:45", "6:15"]
        answer: 1

